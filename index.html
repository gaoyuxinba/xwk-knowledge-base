<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小微行业知识库 V4.0 · 行业与岗位知识看板</title>
<link rel="stylesheet" href="style.css?v=20260930v44">
</head>
<body>

<!-- 登录页 -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">📊</div>
    <h1>小微行业知识库</h1>
    <p class="login-sub">V4.0 · 招聘平台精准数据版</p>
    <form id="loginForm" autocomplete="off">
      <label class="fld">
        <span>账号</span>
        <input type="text" id="loginUser" name="username" autocomplete="off" placeholder="请输入账号" required>
      </label>
      <label class="fld">
        <span>密码</span>
        <input type="password" id="loginPass" name="password" autocomplete="off" placeholder="请输入密码" required>
      </label>
      <div id="loginErr" class="login-err"></div>
      <button type="submit" class="btn-primary btn-block" id="loginBtn">登 录</button>
    </form>
    <p class="login-tip">仅限授权人员访问</p>
  </div>
</div>

<!-- 主界面 -->
<div id="appView" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-ico">📊</span>
      <span class="brand-txt">小微行业知识库<small>V3 看板</small></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="metaMini" class="meta-mini"></div>
      <div class="side-update" id="dataUpdate"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="navToggle" title="菜单">☰</button>
      <div class="crumb" id="crumb">数据看板</div>
      <div class="top-right">
        <div class="userbox">
          <span class="avatar" id="userAvatar">管</span>
          <div class="userinfo">
            <b id="userName">—</b>
            <small id="userRole">—</small>
          </div>
          <div class="usermenu" id="userMenu">
            <button data-act="logout">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- 弹层 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox">
    <div class="modal-head"><b id="modalTitle">标题</b><button class="icon-btn" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<!-- 数据文件 -->
<script src="static/data1.js?v=20260930v44"></script>
<script src="static/data2.js?v=20260930v44"></script>
<script src="static/data3.js?v=20260930v44"></script>
<script src="static/data4.js?v=20260930v44"></script>
<script src="static/data5.js?v=20260930v44"></script>
<script src="static/data6.js?v=20260930v44"></script>
<script src="static/data7.js?v=20260930v44"></script>
<script src="static/data8.js?v=20260930v44"></script>
<script src="static/data9.js?v=20260930v44"></script>
<script src="app.js?v=20260930v44"></script>
</body>
</html>
