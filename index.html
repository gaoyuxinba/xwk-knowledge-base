.toast{background:#fff;border-radius:8px;padding:12px 20px;box-shadow:var(--shl);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:slideIn .3s ease;border-left:4px solid var(--primary)}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--danger)}.toast.warning{border-left-color:var(--warning)}

.pg{display:flex;gap:4px;justify-content:center;align-items:center;margin-top:16px}

.pg button:hover{background:var(--primary-light);border-color:var(--primary)}
.pg button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

<h1 style="font-size:20px;font-weight:700;color:#1e293b;margin-bottom:6px;">小微行业知识库</h1>
<p style="font-size:13px;color:#64748b;">请输入访问密码</p>
</div>
<div style="margin-bottom:16px;">
<input type="password" id="login-pw" placeholder="输入密码..." style="width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:8px;font-size:15px;outline:none;transition:border .2s;" onkeydown="if(event.key==='Enter')checkLogin()" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e2e8f0'">
<p id="login-err" style="color:#dc2626;font-size:12px;margin-top:8px;display:none;">密码错误，请重新输入</p>
</div>
<button onclick="checkLogin()" style="width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">进 入 系 统</button>
<p style="text-align:center;font-size:11px;color:#94a3b8;margin-top:20px;">仅限授权人员访问</p>
</div>
</div>
<script>
function checkLogin(){
  var pw=document.getElementById('login-pw').value;
  var enc=btoa(pw.split('').reverse().join('')+'xwk2026');
  if(enc==='YnN4aHl4Ynh3azIwMjY='){
    sessionStorage.setItem('xwk_auth','ok');
    document.getElementById('login-overlay').style.display='none';
    if(typeof init==='function')init();
  }else{
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-pw').value='';
    document.getElementById('login-pw').focus();
  }
}
window.addEventListener('DOMContentLoaded',function(){
  if(sessionStorage.getItem('xwk_auth')==='ok'){
    document.getElementById('login-overlay').style.display='none';
  }
});
</script>

②油费与过路费日结而运费月结的持续错配；③春节前运费上涨但需垫付运力", "主要经营风险": "①车辆已抵押或融资租赁（产权不清，重复融资是重大欺诈信号）；②运价下行与油价上涨的双向挤压；③交通事故与货物损失（保险覆盖不足则损失巨大）；④司机流失与工资垫付；⑤客户账期延长与坏账；⑥超载与环保限行处罚", "政策与外部驱动": "公路货运治超与环保限行、新能源货车推广与路权优惠、网络货运平台监管、能源保供运输任务（太原）、油价与过路费政策"}, {"行业编号": "JT02", "行业门类": "交通运输仓储物流", "细分行业": "城市配送 / 快递网点", "典型经营主体形态": "个体户（承包区）或有限公司（网点）", "必备证照资质": "快递业务经营许可证（总部持有，网点需备案）、道路运输经营许可、营业执照", "常见经营规模(小微口径)": "日派件2000-30000票，年流水100万-3000万", "订单与客户来源": "总部派费+电商客户发货返利；区域承包制", "典型融资用途": "场地租金、分拣设备、车辆、派费垫付、总部押金", "运作方式": "交通物流", "盈利逻辑": "快递网点 / 城市配送", "上下游与结算回款方式": "承包区域→总部系统派件→驿站与快递员派送→揽收电商客户→派费与揽收差价结算", "成本结构(占比)": "派费收入低（每票0.5-1.5元），利润主要来自揽收（电商客户发货，每票差价0.5-3元）", "资金需求特点与周期": "上游：总部按派费与揽收结算（月结或周结，扣除罚款）。下游：快递员按件计酬（日结或周结）、场地租金月付", "授信关注要点": "派费与工资45%-60%、场地与设备10%-15%、总部扣款与罚款、车辆与油费", "前景趋势判断": "电商件量仍增长但派费持续下行，网点利润主要靠揽收（电商客户发货）。总部与网点利益博弈激烈（罚款、任务量、区域调整），网点经营风险高。即时配送（同城、生鲜、医药）是新增长点", "毛利率区间": "派件毛利低（每票0.5-1.5元），揽收差价毛利0.5-3元/票；综合毛利10%-20%", "净利率区间": "3%-8%（总部罚款与人工成本侵蚀严重，亏损网点占比高）", "旺季月份": "双十一、双十二、春节前（业务量暴增2-5倍）、618", "淡季月份": "3-4月、6-7月（大促后的低谷）", "季节性资金缺口高峰": "①大促前的临时用工与运力垫付（业务量暴增但派费滞后结算）；②总部押金与承包费；③场地租金与分拣设备投入", "主要经营风险": "①总部经营风险传导（网点被动受损，罚款与任务量单方调整）；②承包合同不稳定（区域被调整或收回）；③派件量下滑与揽收客户流失；④快递员工资发放与劳动纠纷；⑤爆仓与服务投诉罚款", "政策与外部驱动": "快递业价格战监管与派费保障政策、电商件量增长、即时配送与同城零售、快递员权益保障（社保与工伤）"}, {"行业编号": "JT03", "行业门类": "交通运输仓储物流", "细分行业": "冷链仓储 / 冷库经营", "典型经营主体形态": "有限公司", "必备证照资质": "营业执照、食品经营/仓储备案、消防验收、特种设备（压力容器/制冷）检验", "常见经营规模(小微口径)": "库容1000-20000吨，年营收200万-5000万", "订单与客户来源": "食品厂、生鲜批发、餐饮连锁、医药（需GSP）", "典型融资用途": "冷库建设/改造、制冷设备、电费（刚性大额）", "运作方式": "交通物流", "盈利逻辑": "冷链仓储/冷库经营", "上下游与结算回款方式": "建设或租赁冷库→制冷设备安装→承接食品厂、生鲜批发、餐饮连锁、医药的仓储与配送→按吨天或托位计费", "成本结构(占比)": "仓储费毛利20%-35%、冷链配送毛利15%-25%；电费是最大变动成本，库容利用率决定盈亏", "资金需求特点与周期": "上游：食品厂与餐饮连锁月结30-60天、生鲜批发周结或月结、医药客户（需GSP）月结。下游：电费月缴（刚性大额）、设备维保、场地租金", "授信关注要点": "电费25%-35%（冷库最大成本）、折旧或租金20%-30%、人工15%-25%、制冷设备维保、包装耗材", "前景趋势判断": "生鲜电商、预制菜、医药冷链需求推动增长；但冷库建设投入重、回收期长、电费占比高，产能过剩区域竞争激烈。医药冷链（GSP）与多温区能力是差异化方向", "毛利率区间": "仓储费毛利20%-35%，冷链配送15%-25%，医药冷链（GSP）30%-45%", "净利率区间": "5%-13%（电费与折旧占比高）", "旺季月份": "6-9月（夏 50个桩，收入靠充电服务费，回收期较长（5-8年），依赖车流量与利用率", "订单与客户来源": "网约车出租车司机、私家车主、物流车队、平台导流（特来电、星星充电等）", "典型融资用途": "充电桩与变压器设备采购、场地租金、电力增容、运营周转", "运作方式": "能源环保", "盈利逻辑": "充电桩运营/充电站", "上下游与结算回款方式": "选址与场地合作→电力增容与变压器安装→采购充电桩→接入运营平台→充电服务收费→设备运维", "成本结构(占比)": "收入=电费（代收，几乎无毛利）+服务费（毛利来源，每度0.3-0.8元）；设备利用率与车流量决定盈亏，回收期通常5-8年", "资金需求特点与周期": "上游：车主通过平台支付、平台结算T+1至T+15、企业车队月结。下游：电力公司按月缴电费（刚性大额）、设备厂商预付或分期、场地方按月或按分成结算", "授信关注要点": "设备折旧30%-40%、场地租金或分成20%-30%、电力增容与运维、平台佣金、电费（代收部分不计毛利）", "前景趋势判断": "新能源车保有量快速增长驱动充电桩需求上行（重庆2025年新能源车产量129.6万辆增长36%、南京新能源渗透率高），但服务费被竞争压缩、优质场地稀缺、设备利用率分化严重。光储充一体与重卡换电是新方向", "毛利率区间": "充电服务费毛利（扣除电费后）30%-50%，但整体净利受利用率主导", "净利率区间": "3%-12%（利用率30%以上才较好，回收期5-8年）", "旺季月份": "节假日（高速出行充电高峰）、夏季（网约车与出行增加）、冬季（电动车续航下降导致充电频次上升）", "淡季月份": "3-4月、9-10月（相对平稳，无明显淡旺季）", "季节性资金缺口高峰": "①设备与变压器一次性重投入（单站数十万至数百万）；②电力增容与场地改造费用；③运营期的电费垫付（代收部分需先缴）与场地租金；④设备回收期长与贷款期限短的错配", "主要经营风险": "①场地租赁合同剩余期限短于贷款期限（场地被收回则设备价值归零，核心风险）；②设备利用率不足即亏损（选址决定生死）；③电力增容与并网手续不完备；④充电桩产权已抵押或融资租赁（重复融资）；⑤设备技术迭代快（大功率超充替代慢充）导致贬值；⑥补贴政策退坡与服务费价格战；⑦与物业或场地的分成协议变动", "政策与外部驱动": "新能源汽车渗透率持续提升、充电桩基础设施建设规划与补贴、电力市场化改革与峰谷电价（影响运营成本）、光储充一体化推广、居住区充电设施配建要求、设备技术标准升级（超充与液冷）"}, {"行业编号": "JY01", "行业门类": "教育", "细分行业": "职业培训 / 艺术培训 / 托管", "典型经营主体形态": "有限公司或民办学校", "必备证照资质": "办学许可证（学科类/职业培训需审批）、营业执照、消防验收；托管部分城市仅需营业执照+食品经营许可", "常见经营规模(小微口径)": "学员100-3000人，年营收50万-3000万，预收费模式", "订单与客户来源": "周边家长、校企合作、线上引流", "典型融资用途": "场地装修、师资工资、招生推广；预收学费属负债需重点核实", "运作方式": "教育", "盈利逻辑": "培训机构与托管（预收费模式）", "上下游与结算回款方式": "招生获客→预收学费（按课时包）→排课授课→课时消耗确认收入→续报", "成本结构(占比)": "毛利50%-70%（课时消耗后），净利10%-25%；招生成本与教师流失是主要风险", "资金需求特点与周期": "上游：家长预付（现金流前置，属负债）。下游：教师工资月付、房租季付/年付、教材与平台", "授信关注要点": "教师薪酬30%-45%、房租20%-30%、招生营销15%-25%、教材与设备", "前景趋势判断": "学科类培训受\"双减\"严格限制，素质类（艺术、体育、编程）、职业培训（考证、技能）、成人教育是主流方向。预收费监管（资金存管、限额、按月拨付）持续收紧，传统预收模式受冲击", "毛利率区间": "50%-70%（课时消耗后），素质类与职业培训偏高", "净利率区间": "10%-25%（招生成本与教师薪酬占比高；预收款是负债非利润）", "旺季月份": "寒暑假前招生（6月、12月-1月）、开学季（9月、3月）、考前冲刺期", "淡季月份": "开学后的非招生期（10-11月、4-5月）、暑假授课期（收入确认但招生少）", "季节性资金缺口高峰": "①装修与开业招生一次性投入；②招生季的营销推广费用；③寒暑假的教师课时费集中支付", "主要经营风险": "①重大风险：办学许可证缺失（无证办学是重大合规风险，随 据，额度从严，期限宜短，原则上要求有效担保", "note": "C级客户量大面广，是普惠业务的基本盘，但不能放量，须一户一核"}, {"level_type": "分层方法（五级）", "level_name": "D级·中高风险", "criteria": "行业景气下行、需求萎缩，或应收账款账期显著恶化，或价格波动剧烈导致库存跌价，或政策收紧", "action": "严控新增、压缩存量。确需介入的必须有强担保（足额抵押或强保证），且回款来源明确可锁定", "note": "D级须逐户报有权审批人，重点看\"在手订单真实性+付款方信用+应收账龄\"三件事"}, {"level_type": "分层方法（五级）", "level_name": "E级·高风险", "criteria": "产能过剩且无转型能力、环保或安全不达标面临关停、核心资质缺失、无真实经营（空壳包装）、涉刑事合规风险", "action": "原则上回避。存量逐步退出", "note": "E级中出现\"涉危废无证经营、无特行证开旅馆、假酒假烟、无办学许可招生\"等情形，属合规红线，不得介入"}, {"level_type": "重庆·总体判断", "level_name": "城市基本面（2026年上半年）", "criteria": "GDP 16702.17亿元、同比增4.2%（重庆市统计局7月21日发布）。二产增加值5649.04亿元增2.2%，三产10347.97亿元增5.3%；规上工业增加值增4.1%；社零8491.38亿元增2.3%、其中餐饮收入1002.48亿元增2.1%；半年居民人均可支配收入23127元增4.6%", "action": "四城中体量最大、消费与投资仍有正增长，适合做规模。展业主线：制造配套（顺着汽车摩托车产业链）+ 大众消费（餐饮零售）+ 通道物流", "note": "一季度增4.5%、上半年增4.2%，增速略有回落但仍处合理区间。民营经济占比61.6%（2025年），小微客群基数大、活力强"}, {"level_type": "重庆·上升行业", "level_name": "上升（景气向上，可倾斜资源）", "criteria": "①摩托车：上半年产量572.77万辆、同比增49.7%，出口占比高，配套零部件需求旺；②智能装备及智能制造集群增10.5%、AI及机器人增34.9%；③新一代电子信息制造增7.4%（液晶显示屏增9.7%、集成电路圆片增20.4%）；④智能网联新能源汽车增5.8%，锂离子电池产量增63.2%；⑤餐饮：收入1002.48亿元增2.1%，火锅产业链上下游产值超3000亿元；⑥消费升级品类：体育娱乐用品零售增22.5%、通讯器材增12.6%", "action": "A-B级为主。摩托车与汽车零部件配套、火锅食材供应链、大众餐饮、通道物流与跨境电商可重点拓展", "note": "重庆的上升行业有明确的产量与增速数据支撑，不是概念。顺着33618集群的核心企业找上下游小微，是最有效的获客路径"}, {"level_type": "重庆·下降或承压行业", "level_name": "下降/承压（须严控）", "criteria": "①二产增速2.2%低于三产，传统制造与建筑承压；②房地产相关链条（房建、装饰、建材、家具）受开发投资下行影响，订单与回款双双承压；③成品油零售受新能源车渗透影响长期销量下行（2025年新能源汽车产量129.6万辆增36%）；④低端过剩制造与传统批发市场受电商分流", "action": "D级为主。房建与装饰、建材贸易须核在手订单与应收账龄；传统批发市场关注客流下滑；加油站关注长期需求替代", "note": "重庆建筑业2025年增加值2762.83亿元仍有规模，但增速与回款质量需逐户核查，政府类与房企类客户分开对待"}, {"level_type": "南京·总体判断", "level_name": "城市基本面（2026年上半年）", "criteria": "GDP 9729.07亿元、同比增5.3%（南京市统计局7月28日发布），增速高于全国（4.7%）和全省（5.2%），居全国城市第10位。二产2926.82亿元增3.0%、规上工业增4.1%；三产6686.54亿元增6.3%；规上装备制造业增5.9%、高技术制造业增14.5%；37个工业大类中31个增长（增长面83.8%）；规上服务业营收增7.0%、生产性服务业贡献率80.6%", "action": "四城中增速第二、结构最优，适合做质量。展业主线：软件与信息技术服务、智能电网与集成电路配套、高技术制造、生产性服务业", "note": "唯一隐忧是消费端偏弱：上半年社零4363.83亿元、下降0.5%。消费类小微要看实际客流，不宜按宏观增速放量"}, {"level_type": "南京·上升行业", "level_name": "上升（景气向上，可倾斜资源）", "criteria": "①高技术制造业增加值增14.5%（渝宁晋三城最快）；②集成电路产量增37.2%、新能源汽车产量增44.1%、工业机器人产量增18.8%、服务机器人增269.7%；③软件和信息服务业：2025年收入约1.02万亿元、为全市首个万亿级集群，从业人员约90万人，2026年推进\"人工智能+软件\"；④智能电网（新型电力）为国家首批25个先进制造业集群之一，2025年规模突破5000亿元；⑤生产性服务业营收增7.0%、贡献率80.6%", "action": "A-B级为主。软件IT服务、集成电路与智能电网配套、机器人与高端装备配套是南京最具辨识度的优质客群，可用知识产权质押、订单与应收账款融资", "note": "南京的上升行业全部有上半年产量或营收数据支撑。软件小微的核心风险不是行业不行，而是\"工资月付、项目回款在验收后\"的垫资错配，期限设计要跟着合同节点走"}, {"level_type": "南京·下降或承压行业", "level_name": "下降/承压（须严控）", "criteria": "①社零下降0.5%，消费端偏弱：传统零售、百货、服装门店客流与销售额承压；②建筑业表现不佳、拉低二产增速（2025年固投下降4.9%，扣除房地产开发投资后增2.4%）；③房地产开发链条下行传导至装饰、建材、家具、家电；④学科类培训受政策限制；⑤餐饮住宿虽有文旅客流支撑（2025年接待游客20052.8万人次），但竞争与成本压力大", "action": "消费零售类降为C-D级，重点看门店实际流水与租约；房建与装饰类D级，核在手订单与应收账龄；文旅类看OTA真实经营数据", "note": "南京人均收入四城最高（2025年78243元），高端消费与文旅仍有机会，但上半年社零负增长说明总量端在收缩，要做结构不做总量"}, {"level_type": "太原·总体判断", "level_name": "城市基本面（2026年上半年）", "criteria": "GDP 2413.70亿元、同比增2.0%（太原市统计局8月3日发布），四城中最低；一季度增3.1%、上半年回落至2.0%，追赶全年5%目标压力大。二产629.25亿元下降3.9%、规上工业增加值下降1.3%；三产1765.92亿元增4.3%、占GDP 73.1%（四城最高）；社零1068.48亿元下降6.2%（四城降幅最大）；一般公共预算收入225.10亿元增5.3%；金融业增加值增6.1%、房地产业增1.6%、其他服务业增6.7%", "action": "四城中最需谨慎，适合做精不做量。展业主线：特钢与装备制造的真实配套链条、能源保供物流、有政策支持的转型项目。压缩建筑与传统消费敞口", "note": "结构上有亮点：煤炭增2.2%、钢铁增3.2%，传统能源原材料基本盘稳住；财政正增长、金融业增6.1%。下行压力主要来自非煤非钢的其他工业和消费端"}, {"level_type": "太原·上升行业", "level_name": "上升（景气向上，可倾斜资源）", "criteria": "①钢铁与特钢：上半年钢铁行业增3.2%，依托太钢（2025年不锈钢产量560.81万吨）的不锈钢深加工配套有真实需求；②煤炭及能源保供物流：煤炭行业增2.2%，太原承担山西能源保供的物流组织职能，货运车队需求稳定；③金融业增6.1%、其他服务业增6.7%，服务业是三产增长主力；④新兴产业：战略性新兴产业占比已突破30%（2025年），信创、新材料、高端装备制造（太重集团配套）有政策与订单支撑；⑤特色专业镇：清徐老陈醋入选工信部首批传统优势食品产区", "action": "B-C级为主，A级较少。优先选择进入太钢、太重合格供方名录的配套小微（订单真实、回款有保障），核票据结算与账期；煤炭物流类核车辆权属与ETC", "note": "太原的上升行业总量小、集中度高，多数依附核心企业。脱离核心企业配套关系的独立小微，景气度判断要打折扣"}, {"level_type": "太原·下降或承压行业", "level_name": "下降/承压（须严控）", "criteria": "①建筑业：2025年固投下降18.0%（四城中最大降幅）、建筑业总产值3432.47亿元下降7.5%、房屋建筑业产值下降11.7%；2026年上半年二产继续下降3.9%，建筑链条未见改善；②消费零售：上半年社零下降6.2%（四城降幅最大），传统批发市场、百货、餐饮客流与价格双承压；③房地产链条：开发投资下行传导至装饰、建材、家具、家电；④民营经济偏弱：民间投资占比39.2%、低于全国约10.9个百分点，小微融资需求与还款能力都受限；⑤非煤非钢的其他工业：规上工业下降1.3%的主要拖累项", "action": "建筑类与建材贸易D级且原则上从严，必须核在手订单、政府专项资金到位情况与应收账龄；消费零售类降为C-D级并压缩额度；非煤非钢的独立制造小微重点核订单真实性", "note": "太原是本手册中风险提示最集中的城市。建筑业与消费端同时下行，这两类恰是小微客群的主力，须把额度与担保要求提高一档"}, {"level_type": "青岛·总体判断", "level_name": "城市基本面（2026年上半年）", "criteria": "GDP 9138.18亿元、同比增长5.5%，高于全国0.8个百分点（青岛市统计局2026年7月24日发布，全国城市第十二、北方第二）。一产236.93亿元增3.7%、二产2926.72亿元增4.0%、三产5974.53亿元增6.4%、服务业占比65.4%；规上工业增加值增7.3%、35个大类中29个增长（增长面82.9%）；社零3370.9亿元增2.8%；进出口4672.1亿元增5.7%、其中出口2817.2亿元增6.9%；CPI增1.0%；6月末本外币贷款余额35289.8亿元增5.6%", "action": "四城中增速第二、工业增速第一、外向度最高。展业主线：制造配套（轨道交通装备、智能家电、汽车、橡胶新材料的合格供方名录）+ 口岸物流与跨境电商 + 海洋与水产特色产业链。建筑类只跟政府与平台项目", "note": "青岛的结构性亮点是工业和外贸，短板是消费与投资：上半年固定资产投资仅交通运输仓储邮政业（+1.0%）与金融业（+5.8%）两个行业正增长，住宅建安链条仍在收缩，因此不能按5.5%的整体增速给建筑类小微放量"}, {"level_type": "青岛·上升行业", "level_name": "上升（景气向上，可倾斜资源）", "criteria": "①工业与制造配套：规上工业增7.3%，专用设备、通用设备、汽车、橡胶和塑料制品业均两位数增长，传感器产量增83.8%、集成电路圆片增60.7%、虚拟现实设备增30.6%；②口岸物流：交通运输仓储邮政业增加值增10.6%，青岛港货物吞吐量3.73亿吨增3.2%、集装箱1822万TEU增7.0%、液体散货增8.4%，外贸航线近240条居北方首位、新增外贸航线15条、国际中转集拼增52.6%、航运中心排名升至全球第12位；③外贸与民营经济：进出口增5.7%、民营企业进出口3463.7亿元增9.8%占74.1%；④海洋经济：海洋生产总值增21.9%、涉海固定资产投资增15.1%、水产品产量43.0万吨增4.5%；⑤生产性服务业：1-5月规上服务业营收增7.9%，互联网和相关服务增24.0%、研究和试验发展增12.9%、商务服务业增12.5%；⑥升级类消费：智能手机零售增20.2%、新能源汽车增18.2%、网络零售占限上44.5%", "action": "A-B级为主。中车四方与海尔海信与一汽大众与赛轮双星的供应链上下游小微、港口集疏运与货代报关、冷链与预制菜、跨境电商与外贸工厂是青岛最优质的客群，可用订单与应收账款、仓单与知识产权增信", "note": "上升行业全部有上半年产量、吞吐量或营收数据支撑（①类公开统计数据）。政策工具充足：小微融资协调机制走访53万户、获贷超5400亿元居全省首位、为1.2万余户办理无还本续贷245.8亿元；青融通累计助1.89万家企业融资4632.78亿元；“47条”小店经济含8大领域专项贴息；309个金融服务驿站、推荐清单9.1万户、授信6625.7亿元、放贷4932.5亿元、平均利率3.42%"}, {"level_type": "青岛·下降或承压行业", "level_name": "下降/承压（须严控）", "criteria": "①房地产开发链条：上半年居住类价格与上年持平，投资端仅两个行业正增长，房建、装饰、门窗幕墙、建材贸易、家具需求同步承压；②大宗建材与散货：青岛港干散杂货吞吐量1.18亿吨、下降7.5%，钢材水泥砂石到港量收缩，钢价波动下贸易商易被跌价吞掉利润；③传统实体零售：公共网络零售额占限上44.5%、增长17.1%，线下日用百货与服装门店持续被分流；④低端养殖与过剩产能：猪牛羊禽肉产量增10.6%后猪价周期下行风险显现，饲料与防疫成本上升；⑤成品油零售：新能源汽车零售增18.2%长期替代燃油需求；⑥即时娱乐业态：剧本杀、密室同质化布点、生命周期短", "action": "D级为主。房建与装饰、门窗幕墙、土石方、建材贸易须核在手订单性质与应收账龄，原则上只做有强担保或政府类付款来源的客户；大宗贸易类对无实体仓储与终端客户的中间商不予介入；实体零售以门店实际流水与租约为准", "note": "青岛的下行集中在住宅投资与大宗建材两端，属于结构性问题而非全市性问题。与太原的区别在于：太原是建筑与消费同时下行，青岛是建筑下行而工业与外贸上行，因此青岛的策略是“换行业不换城市”"}, {"level_type": "四城横向对比", "level_name": "一句话结论", "criteria": "重庆：体量最大（GDP 16702亿元）、消费与投资仍正增长，摩托车与智能装备上行，建筑类靠城市更新与技改撑住——做\"量\"。\n南京：增速5.3%、结构最优，软件与集成电路、智能电网集群强，消费端偏弱——做\"质\"。\n太原：增速2.0%、投资与消费同步收缩，仅特钢与能源保供物流有支撑——做\"精\"。\n青岛：增速5.5%、工业最快（规上工业+7.3%）、外向度最高（进出口+5.7%、民营占74.1%），港口物流与制造配套与海洋产业三主线，住宅投资链仍在收缩——做\"出口与配套\"。", "action": "资源分配建议：青岛与南京优先（工业与外贸景气最高）、重庆做规模（客群基数最大）、太原聚焦核心企业配套白名单（严控建筑与传统产能敞口）。\n四城策略关键词：青岛做出口与配套、重庆做量、南京做质、太原做精。跨区域展业时逐行业对照 06_70行业四城风险分级明细，不要按城市一刀切。", "note": "典型例子：同为建筑施工总承包，在青岛因105个城中村改造、胶州湾第二隧道、官路水库输配水一期77.99亿元等政府类项目可做到B-C级，但在太原因固投下降18.0%只有D级；同为货运，在青岛是港口集疏运与外贸集装箱（集装箱1822万TEU、+7.0%）质量最高，在太原是煤炭保供运输，在重庆是山地短驳与多式联运，在南京是航空与电商仓配。"}, {"level_type": "【数据性质与口径说明】", "level_name": "数据来源与使用边界", "criteria": "本表所有增速与总量数据均为①类公开统计数据，来源：重庆市统计局《2026年上半年重庆市经济运行情况》（7月21日）、南京市统计局《2026年上半年南京市经济运行情况》（7月28日）、太原市统计局《上半年太原市经济运行情况新闻发布稿》（8月3日）；2025年全年数据来自各市统计公报", "action": "分层结论与授信动作建议为③类定性判断，基于上述数据与行业逻辑推导，可用于内部培训、资源分配讨论与向管理层汇报；不得作为单一客户的授信依据", "note": "三点口径提示：①2026年数据为上半年（1-6月）口径，与2025年全年不可直接比总量，比增速更准确；②前三季度数据按惯例须10月下旬才发布，本手册2026年9月编制时尚无三季度官方数据；③太原2026年上半年的固投分项数据未见官方完整发布，本表涉及太原投资景气度时沿用2025年全年口径（固投下降18.0%、建筑业产值下降7.5%），已注明\n④青岛数据：2026年上半年来源于青岛市统计局、国家统计局青岛调查队《2026年上半年全市经济运行情况》（2026年7月24日发布），港口数据来源于青岛港上半年生产通报，普惠金融数据来源于青岛市小微企业融资协调工作机制与人民银行青岛市分行公开披露。"}, {"level_type": "【与06表的配合使用】", "level_name": "查找路径", "criteria": "本表给的是框架与四城总体判断；06表《70行业四城风险分级明细》给的是逐个行业在四城的具体层级与依据", "action": "使用顺序：①先在本表看所在城市的基本面与上升/下降行业清单，确定大方向；②到06表按行业编号或行业名查到该行业在四城的具体层级；③回到01表查行业档案、02表查经营模式、03表查利润淡旺季、04表查在职岗位核实办法", "note": "01至06表用同一套行业编号（JZ建筑、ZZ制造、PF批发零售、CY餐饮住宿、JT交通物流、NY农林牧渔、JM居民服务、SW商务服务、XX信息服务、FD房地产、HB能源环保、JY教育、YL医疗健康、WL文体娱乐、QT其他），可跨表直接对照筛选"}], "city_profiles": [{"metric": "对比维度", "values": ["重庆", "南京", "太原", "青岛", "北京", "上海", "广州", "深圳", "成都", "杭州", "武汉", "西安", "苏州", "郑州", "长沙", "东莞", "合肥", "佛山", "天津", "宁波"]}, {"metric": "经济总量与增速（2026年上半年最新）", "value 大幅下滑、社零下降6.2%、民营经济偏弱。小微画像：资源与重工产业链配套型为主，受大宗商品周期与转型阵痛双重影响", "", "", "", "租金成本高、产业外迁压力、科创企业估值波动"], ["当地授信策略要点", "①优先选择进入太钢、太重等核心企业合格供方名录的配套小微（订单真实、回款有保障），但需核票据结算与账期；②不锈钢深加工类关注钢材采购发票与库存量价、加工设备产能；③煤炭物流运输类关注车辆产权与是否已抵押、ETC与行驶里程验证运营真实性；④建筑类小微须高度审慎：2025年固投下降18%、建筑业产值下降7.5%，2026上半年二产继续下降3.9%，重点核在手订单、应收账款账龄与政府专项资金到位情况；⑤传统商贸餐饮类上半年社零下降6.2%，关注客流下滑与价格竞争，额度宜保守；⑥特色专业镇（清徐醋等）有政策支持，可关注但需评估市场容量", "", "", "", "重点关注科创园区、文创园区、专业服务楼宇"], ["【数据性质与口径说明】", "本表太原数据：2026年上半年数据来源于太原市统计局、国家统计局太原调查队《上半年太原市经济运行情况新闻发布稿》（2026年8月3日发布）及一季度数据（5月6日发布）；2025年全年数据来源于《太原市2025年国民经济和社会发展统计公报》（2026年5月8日发布）、太原市第五次全国经济普查公报。均为公开统计数据", "", "", "", "2025年北京市统计局发布数据"], ["◆ 行业差异（来自 08_城市行业差异交叉表，17 个重点行业）", "", "", "", "", ""], ["建筑施工总承包", "景气度最低：2025年固定资产投资下降18.0%，建筑业总产值3432.47亿元下降7.5%，上半年房屋建筑业产值下降11.7%。订单萎缩、政府类回款压力大，是建筑类授信最需谨慎的城市", "", "", "", "房建受控但基建持续：非首都功能疏解背景下建筑规模受控，但城市更新与轨道交通持续投入，市政项目稳定。重点核：①项目是否在京内及周边；②是否参与市政/轨交项目；③建造师社保与注册单位一致性。"], ["建筑劳务分包", "建筑业产值下滑导致劳务需求萎缩，班组开工率不足；欠薪风险上升，是重点排查领域", "", "", "", "劳务成本高且外来劳务多：北京建筑工人薪资水平全国领先，劳务队伍多来自河北/河南/山东，用工合规要求严格。重点核：①农民工工资专户；②劳务分包合同；③社保缴纳情况。"], ["建材贸易（钢材/水泥/砂石）", "本地钢材资源丰富（依托太钢），钢材贸易与深加工一体化程度高，价格随行就市；但下游工地需求萎缩导致周转放缓、库存积压风险上升", "", "", "", "高端建材与绿色建材为主：北京严控高耗能产业，本地建材产能少，主要从河北/天津输入，绿色建材和装配式建材需求增长。重点核：①进货渠道与运输凭证；②是否有市政/国企合格供方资质。"], ["机械加工与零部件制造", "特钢与重型装备配套：依托太钢（不锈钢560.81万吨）与太重集团，做不锈钢深加工、大型结构件、矿山机械配件。原料本地采购便利（可现款或短账期），但下游需求受能源与地产周期影响", "", "", "", "高端制造与精密加工：北京制造业向高端化、智能化转型，航空航天、精密仪器、智能制造装备配套需求大。重点核：①是否为高端制造配套；②研发投入与技术人员占比。"], ["食品加工制造", "特色专业镇模式突出：清徐老陈醋入选工信部首批传统优势食品产区和地方特色食品产业重点培育名单；另有面食、杂粮、畜产品加工。产业规模相对小，市场半径以省内为主", "", "", "", "都市食品与中央厨房：北京以烘焙、乳品、休闲食品、餐饮中央厨房为主，供应链服务商超与电商发达。重点核：①食品经营许可证；②商超/电商进场记录；③冷链物流凭证。"], ["餐饮住宿服务", "以面食、家常菜、大众餐饮为主，客单价与消费频次低于重庆南京；人均收入46446元制约高端餐饮发展；酒店业受商务与能源行业差旅影响，波动大", "", "", "", "高端餐饮与文旅餐饮为主：北京餐饮消费层次丰富，高端餐饮、老字号、文旅餐饮特色突出，2025年餐饮收入约1300亿元。重点核：①食品经营与消防；②房租合同与流水；③点评/外卖数据。"], ["软件与信息技术服务", "以信创产业为特色（省级布局），规模与生态远小于南京；小微软件企业多承接省内政府与国企信息化项目，市场容量有限", "", "", "", "全国最强科创与互联网集聚：北京是全国互联网与科创中心，软件与IT服务企业数量多、层次高，字节/百度/京东等龙头带动生态。重点核：①核心技术人员稳定性；②项目合同与回款周期；③知识产权与软著数量。"], ["物流货运", "能源保供物流中枢：全国性综合交通枢纽，承担山西能源保供的物流组织职能，煤炭公路运输与铁路专用线服务是特色；货运车队数量多但运价受能源行业景气影响", "", "", "", "首都物流枢纽与消费配送：北京物流以消费配送、电商快递、航空货运为主，干线物流受货车限行政策影响大。重点核：①道路运输许可证；②车辆通行证件；③配送合同与路线。"], ["新能源与光伏安装", "能源革命综合改革试验区：阳曲绿电园区为标杆项目，美锦氢冶金等氢能项目推进；光伏与氢能安装类小微有政策红利，但受传统能源行业挤出效应与资金面影响", "", "", "", "分布式光伏与绿电交易：北京大力推进分布式光伏和建筑光伏一体化，绿电交易活跃，但户用光伏受建筑形态限制。重点核：①承装（修、试）电力设施许可证；②屋顶产权与租约；③并网验收文件。"], ["再生资源与环保", "煤矸石、粉煤灰、冶金渣等工业固废综合利用是特色赛道，政策支持力度大；废钢资源依托钢铁产业丰富", "", "", "", "电子废弃物与危废处理：北京科创企业多，电子废弃物与工业危废处理需求大，环保合规要求全国最严。重点核：①危险废物经营许可证；②环保审批文件；③处置台账与联单。"], ["商贸批发零售", "2025年社零2365.53亿元增长4.7%；传统批发市场（服装城等）仍是主体，电商渗透率低于南京；美特好等本地连锁商超有区域影响力", "", "", "", "高端消费与专业服务：北京是全国高端消费中心，奢侈品、文创产品、专业服务需求旺盛，批发向品牌化转型。重点核：①品牌授权/代理协议；②销售流水与会员数据；③库存周转与账期。"], ["教育与职业培训", "以K12素质类、艺术类、职业培训为主，市场规模小于南京重庆；职业教育依托本地产业（能源、装备制造）有特定需求", "", "", "", "科教资源全国最丰富：北京高校与科研机构密集，考研、留学、职业资格、素质教育需求旺盛，教培监管严格。重点核：①办学许可证；②预收费监管账户；③师资资质与稳定性。"], ["医疗健康服务", "医疗资源相对集中于公立体系，民营医疗机构规模较小；药店连锁与基层诊所是主要小微形态；医保控费影响明显", "", "", "", "全国顶级医疗资源：北京三甲医院数量全国第一，民营医院、专科诊所、口腔与医美机构数量多且层次高。重点核：①医疗机构执业许可证；②医护人员资质；③诊疗记录与收费凭证。"], ["文化旅游与休闲娱乐", "2025年重点监测景区接待游客1842.72万人次，门票总收入4.26亿元，旅游经营收入5.82亿元；以晋祠、双塔、古县城为主，文旅规模显著小于重庆南京；民宿与文创处于起步阶段", "", "", "", "历史文化名城与文旅消费：北京是全国顶级文旅目的地，故宫/长城/颐和园等带动文创、民宿、餐饮消费，2025年接待游客约3.3亿人次。重点核：①文旅经营许可；②客流数据与淡旺季；③产权/租约剩余期限。"], ["农业与农产品加工", "以杂粮、蔬菜、畜牧为主，规模小（2025年农林牧渔业总产值85.01亿元）；清徐葡萄、阳曲小米等特色农产品；受水资源与地形限制，产业化程度低", "", "", "", "都市现代农业与精品农业：北京农业占比极低，以精品农业、观光农业、农产品加工配送为主，服务城市消费。重点核：①土地/大棚租约；②食品经营许可证；③商超/电商供货记录。"], ["人力资源与劳务派遣", "能源与装备制造企业用工需求为主，市场容量小；建筑业下滑导致劳务需求萎缩；欠薪风险相对较高", "", "", "", "高端人才服务与科技外包：北京以高端人才寻访、科技外包、灵活用工为主，服务业用工需求大，制造业用工需求小。重点核：①劳务派遣经营许可证；②客户结构与回款；③代收代发工资流水甄别。"], ["汽车后市场（维修/配件/二手车）", "冬季严寒与路况使车辆损耗高，维修保养需求刚性；新能源车渗透率低于南京，配件多需外购、成本高；二手车市场受能源行业收入影响", "", "", "", "高端车与新能源车为主：北京豪华车保有量高，新能源车渗透率全国领先，维修技术要求与客单价高，二手车交易活跃。重点核：①机动车维修经营备案；②环保合规（危废/喷漆房）；③配件采购渠道。"], ["◆ 总体判断与行业升降（来自 05_行业分层框架(四城)）", "", "", "", "", ""], ["总体判断", "GDP 2413.70亿元、同比增2.0%（太原市统计局8月3日发布），四城中最低；一季度增3.1%、上半年回落至2.0%，追赶全年5%目标压力大。二产629.25亿元下降3.9%、规上工业增加值下降1.3%；三产1765.92亿元增4.3%、占GDP 73.1%（四城最高）；社零1068.48亿元下降6.2%（四城降幅最大）；一般公共预算收入225.10亿元增5.3%；金融业增加值增6.1%、房地产业增1.6%、其他服务业增6.7%\n\n【展业主线·授信动作】四城中最需谨慎，适合做精不做量。展业主线：特钢与装备制造的真实配套链条、能源保供物流、有政策支持的转型项目。压缩建筑与传统消费敞口\n\n【口径·备注】结构上有亮点：煤炭增2.2%、钢铁增3.2%，传统能源原材料基本盘稳住；财政正增长、金融业增6.1%。下行压力主要来自非煤非钢的其他工业和消费端", "", "", "", "城市基本面（2026年上半年）"], ["上升行业", "①钢铁与特钢：上半年钢铁行业增3.2%，依托太钢（2025年不锈钢产量560.81万吨）的不锈钢深加工配套有真实需求；②煤炭及能源保供物流：煤炭行业增2.2%，太原承担山西能源保供的物流组织职能，货运车队需求稳定；③金融业增6.1%、其他服务业增6.7%，服务业是三产增长主力；④新兴产业：战略性新兴产业占比已突破30%（2025年），信创、新材料、高端装备制造（太重集团配套）有政策与订单支撑；⑤特色专业镇：清徐老陈醋入选工信部首批传统优势食品产区\n\n【展业主线·授信动作】B-C级为主，A级较少。优先选择进入太钢、太重合格供方名录的配套小微（订单真实、回款有保障），核票据结算与账期；煤炭物流类核车辆权属与ETC\n\n【口径·备注】太原的上升行业总量小、集中度高，多数依附核心企业。脱离核心企业配套关系的独立小微，景气度判断要打折扣", "", "", "", "上升（景气向上，可倾斜资源）"], ["下降或承压行业", "①建筑业：2025年固投下降18.0%（四城中最大降幅）、建筑业总产值3432.47亿元下降7.5%、房屋建筑业产值下降11.7%；2026年上半年二产继续下降3.9%，建筑链条未见改善；②消费零售：上半年社零下降6.2%（四城降幅最大），传统批发市场、百货、餐饮客流与价格双承压；③房地产链条：开发投资下行传导至装饰、建材、家具、家电；④民营经济偏弱：民间投资占比39.2%、低于全国约10.9个百分点，小微融资需求与还款能力都受限；⑤非煤非钢的其他工业：规上工业下降1.3%的主要拖累项\n\n【展业主线·授信动作】建筑类与建材贸易D级且原则上从严，必须核在手订单、政府专项资金到位情况与应收账龄；消费零售类降为C-D级并压缩额度；非煤非钢的独立制造小微重点核订单真实性\n\n【口径·备注】太原是本手册中风险提示最集中的城市。建筑业与消费端同时下行，这两类恰是小微客群的主力，须把额度与担保要求提高一档", "", "", "", "下降/承压（须严控）"], ["◆ 本城 70 行业风险层级分布（来自 _idx，层级列=第 15+2×序号 列）", "", "", "", "", ""], ["A级·低风险", "0", "0.0%", "优先配置资源。可做信用类、订单与应收账款质押、知识产权质押；额度可适当放大，审批流程从简", "", ""], ["B级·中低风险", "10", "14.3%", "择优拓展。额度与期限按真实回款节奏匹配，落实对应风控措施后可正常推进", "", ""], ["C级·中等风险", "45", "64.3%", "审慎控额。以真实经营流水与硬指标为主要依据，额度从严，期限宜短，原则上要求有效担保", "", ""], ["D级·中高风险", "15", "21.4%", "严控新增、压缩存量。确需介入的必须有强担保（足额抵押或强保证），且回款来源明确可锁定", "", ""], ["E级·高风险", "0", "0.0%", "原则上回避。存量逐步退出", "", ""], ["合计（应=70）", "70", "若合计不等于 70，请检查 _idx 中本城层级列（第 15+2×序号 列）是否 70 行齐全。", "", "", ""], ["◆ 本城政策工具与拓客清单（依据 05/07/08 表数据整理）", "", "", "", "", ""], ["获客主线", "优先选择进入太钢、太重等核心企业合格供方名录的配套小微（订单真实、回款有保障），核票据结算与账期；能源保供物流是特色赛道（全国性综合交通枢纽，煤炭公路运输与铁路专用线服务）；清徐老陈醋等特色专业镇入选工信部传统优势食品产区重点培育名单。", "", "", "", ""], ["尽调要点", "建筑类原则上从严：2025年固投下降18.0%（四城最大降幅）、建筑业总产值3432.47亿元下降7.5%、房屋建筑业产值下降11.7%，必须核在手订单、政府专项资金到位情况与应收账龄；消费零售上半年社零1068.48亿元、下降6.2%（四城最大降幅），降为C-D级并压缩额度。", "", "", "", ""], ["政策工具", "能源革命综合改革试验区、阳曲绿电园区与氢能项目有政策红利；上半年钢铁行业增3.2%、煤炭行业增2.2%，传统能源原材料基本盘稳住；财政正增长、金融业增6.1%。", "", "", "", ""], ["风险提示", "民营经济相对薄弱（民间投资占比39.2%，低于全国约10.9个百分点）；脱离核心企业配套关系的独立小微，景气度判断要打折扣；人均收入46446元制约高端消费天花板。", "", "", "", ""]], "南京": [["31  城市档案 · 南京（公式联动 05/07/08/_idx，随看板所选行业请回 22 表看层级）", "", "", "", "", ""], ["城市序号（=22表A列）", "2", "城市名称", "南京", "表名自检（=22表P列）", "31_城市档案·南京"], ["用法：本表按 B2 城市序号（与 22_城市选择·搜索勾选 表 A 列序号一致）公式联动 05/07/08/_idx 四张表，无需手工维护。新增城市三步：①在 22 表 A 列补序号、B 列补城市名、C 列补定位标签，并在 _idx 按\"层级/依据\"成对补两列；②复制本表，改名为 22 表 P 列显示的名称；③把 B2 改为新序号，全表自动更新。", "", "", "", "", ""], ["◆ 城市画像（来自 07_城市画像·四城对比，本城列自动定位）", "", "", "", "", ""], ["经济总量与增速（2026年上半年最新）", "上半年地区生产总值9729.07亿元，同比增长5.3%，增速高于全国（4.7%）和全省（5.2%），稳居全国城市十强第10位（来源：南京市统计局2026年7月28日发布）；2025年全年19428.78亿元、增长5.2%。一季度GDP4939.60亿元、增长5.5%", "", "", "", "52,073.4亿元"], ["三次产业结构（2026年上半年）", "1.2 : 30.1 : 68.7。第一产业115.71亿元增长3.1%，第二产业2926.82亿元增长3.0%（规上工业增加值增长4.1%），第三产业6686.54亿元增长6.3%、占比近69%", "", "", "", "5.4%"], ["支柱产业集群（含2026年上半年增长）", "\"1026\"先进制造业集群：上半年规上装备制造业增加值增长5.9%、高技术制造业增长14.5%，集成电路产量增长37.2%、新能源汽车产量增长44.1%；软件和信息服务业2025年收入约1.02万亿元、为全市首个万亿级集群；智能电网（新型电力）为国家首批25个先进制造业集群之一", "", "", "", "86.0%"], ["民营与小微经济特征（重庆/南京/太原为2025年口径，青岛为2026年上半年）", "截至2025年底民营企业总数突破65万家、个体工商户超115万户；2025年民营经济增加值9238.4亿元，占GDP比重47.6%，贡献47.9%税收、90%以上科技创新与城镇新增就业", "", "", "", "约1.5万亿元"], ["人口与消费市场（消费为2026年上半年，人口为2025年末）", "2025年末常住人口963.85万人，城镇化率87.5%；上半年社会消费品零售总额4363.83亿元、下降0.5%（消费偏弱是隐忧）；2025年居民人均可支配收入78243元为四城最高，全年接待游客20052.8万人次", "", "", "", "2,184.3万人"], ["投资与建筑业景气度（2025年全年与2026年上半年混合口径）", "2025年固定资产投资下降4.9%，扣除房地产开发投资后增长2.4%；上半年规上装备制造业投资活跃、高技术制造增长14.5%；建筑业表现不佳拉低二产增速", "", "", "", "87.6%"], ["代表性小微行业", "①软件外包与信息技术服务（软件业从业人员约90万人，大量小微软件企业承接大厂外包与政府信息化项目，集聚于中国（南京）软件谷）；②智能电网配套（继电保护、电力自动化、充电桩、智能电表零部件）；③集成电路设计与封测配套服务；④生物医药与医疗器械经销；⑤文旅、教育培训、科技服务", "", "", "", "数字经济、金融、科技服务、文化创意"], ["空间集聚分布（重点园区与市场）", "雨花台区中国（南京）软件谷（软件与信息服务核心）、江北新区与浦口区（集成电路，与江宁区合占全市IC营收约75%）、江宁区（智能电网、智能制造）、栖霞区（新型显示与产业规模居前）、鼓楼区与建邺区（商务与金融服务）、玄武区（文旅与科技）", "", "", "", "科创小微密集、文化创意活跃、专业服务发达"], ["四城核心差异总结", "定位：东部产业创新中心+全国软件产业智能化第一城。特征：三产主导（68.7%）、创新驱动强（90%以上科技创新来自民企）、人均收入高、科教资源密集；但上半年社零负增长、消费端偏弱。小微画像：科技服务型为主，轻资产、人员成本占比高、应收账款账期长", "", "", "", "租金成本高、产业外迁压力、科创企业估值波动"], ["当地授信策略要点", "①软件与IT服务小微是最大特色客群：核心风险是\"工资月付、项目回款在验收后\"的垫资错配，需核在手合同节点、人员社保与工资表、政府类客户预算落实；②智能电网与集成电路配套小微技术门槛高、上半年高技术制造增长14.5%，可做订单与应收账款融资；③知识产权质押、高新技术企业与专精特新资质是重要增信手段；④消费类小微（餐饮、零售、文旅）上半年社零负增长，需重点看实际客流与经营数据稳定性，不宜盲目放量", "", "", "", "重点关注科创园区、文创园区、专业服务楼宇"], ["【数据性质与口径说明】", "本表南京数据：2026年上半年数据来源于南京市统计局、国家统计局南京调查队《2026年上半年南京市经济运行情况》（2026年7月28日发布）及一季度数据（4月29日发布）；2025年全年数据来源于《南京市2025年国民经济和社会发展统计公报》（2026年4月3日发布）、南京市工商联《2025南京市民营经济发展报告》。均为公开统计数据", "", "", "", "2025年北京市统计局发布数据"], ["◆ 行业差异（来自 08_城市行业差异交叉表，17 个重点行业）", "", "", "", "", ""], ["建筑施工总承包", "房建偏弱、工业与基建仍增长：2025年固定资产投资下降4.9%但扣除房地产开发投资后增长2.4%。洁净厂房、实验室、数据中心等高端工业建筑是特色，技术要求与造价高；地铁与市政基建持续投入", "", "", "", "房建受控但基建持续：非首都功能疏解背景下建筑规模受控，但城市更新与轨道交通持续投入，市政项目稳定。重点核：①项目是否在京内及周边；②是否参与市政/轨交项目；③建造师社保与注册单位一致性。"], ["建筑劳务分包", "本地劳务成本高，大量班组来自安徽、苏北、河南；用工合规要求高，社保与工资专户核查严格", "", "", "", "劳务成本高且外来劳务多：北京建筑工人薪资水平全国领先，劳务队伍多来自河北/河南/山东，用工合规要求严格。重点核：①农民工工资专户；②劳务分包合同；③社保缴纳情况。"], ["建材贸易（钢材/水泥/砂石）", "钢材贸易活跃（沿江港口优势），水泥与商混本地及周边供给充足；建材贸易企业规模相对较大、规范化程度高", "", "", "", "高端建材与绿色建材为主：北京严控高耗能产业，本地建材产能少，主要从河北/天津输入，绿色建材和装配式建材需求增长。重点核：①进货渠道与运输凭证；②是否有市政/国企合格供方资质。"], ["机械加工与零部件制造", "精密制造与高端装备配套：智能电网零部件（继电保护、电力自动化）、工业机器人（2025年产量增长35.4%）、IC设备配件。技术门槛与毛利更高，但研发投入大、人员成本高", "", "", "", "高端制造与精密加工：北京制造业向高端化、智能化转型，航空航天、精密仪器、智能制造装备配套需求大。重点核：①是否为高端制造配套；②研发投入与技术人员占比。"], ["食品加工制造", "以烘焙、乳品、休闲食品、餐饮中央厨房为主，供应链服务商超与电商；食品安全与冷链要求高；品牌化程度较高，毛利好于初加工", "", "", "", "都市食品与中央厨房：北京以烘焙、乳品、休闲食品、餐饮中央厨房为主，供应链服务商超与电商发达。重点核：①食品经营许可证；②商超/电商进场记录；③冷链物流凭证。"], ["餐饮住宿服务", "中高端餐饮与文旅餐饮为主：2025年接待游客20052.8万人次，居民人均可支配收入78243元（四城最高），高端消费能力强。酒店业受会展与商务客流支撑，OTA数据可观", "", "", "", "高端餐饮与文旅餐饮为主：北京餐饮消费层次丰富，高端餐饮、老字号、文旅餐饮特色突出，2025年餐饮收入约1300亿元。重点核：①食品经营与消防；②房租合同与流水；③点评/外卖数据。"], ["软件与信息技术服务", "绝对优势赛道：2025年软件业务收入约10200亿元，全市首个万亿级产业集群，从业人员约90万人，位列全国第四并冲刺\"全国软件产业智能化第一城\"；中国（南京）软件谷集聚大量小微软件企业，承接大厂外包（OD/人力外派）与政府信息化项目", "", "", "", "全国最强科创与互联网集聚：北京是全国互联网与科创中心，软件与IT服务企业数量多、层次高，字节/百度/京东等龙头带动生态。重点核：①核心技术人员稳定性；②项目合同与回款周期；③知识产权与软著数量。"], ["物流货运", "华东区域物流节点：禄口机场航空货运+长江港口+高铁网络，电商仓配与冷链发达；快递与城配市场竞争激烈", "", "", "", "首都物流枢纽与消费配送：北京物流以消费配送、电商快递、航空货运为主，干线物流受货车限行政策影响大。重点核：①道路运输许可证；②车辆通行证件；③配送合同与路线。"], ["新能源与光伏安装", "智能电网是国家先进制造业集群，充电桩（2025年新增需求旺盛）、智能电表、储能与新型电力装备配套小微多；分布式光伏推广力度大，工商业屋顶资源较好", "", "", "", "分布式光伏与绿电交易：北京大力推进分布式光伏和建筑光伏一体化，绿电交易活跃，但户用光伏受建筑形态限制。重点核：①承装（修、试）电力设施许可证；②屋顶产权与租约；③并网验收文件。"], ["再生资源与环保", "电子废弃物与工业固废处理需求大（电子信息、IC产业配套），危废处置资质企业价值高；环保标准严格", "", "", "", "电子废弃物与危废处理：北京科创企业多，电子废弃物与工业危废处理需求大，环保合规要求全国最严。重点核：①危险废物经营许可证；②环保审批文件；③处置台账与联单。"], ["商贸批发零售", "华东消费高地：2025年社零8135.85亿元增长3.5%，限额以上实物商品网上零售额增长17.7%占限上社零31.1%，电商渗透率高；高端消费与首店经济活跃", "", "", "", "高端消费与专业服务：北京是全国高端消费中心，奢侈品、文创产品、专业服务需求旺盛，批发向品牌化转型。重点核：①品牌授权/代理协议；②销售流水与会员数据；③库存周转与账期。"], ["教育与职业培训", "科教资源全国前列（高校数量与质量高），考研、留学、职业资格、IT培训需求旺盛；高校成果转化与创业培训活跃；家长教育投入能力强", "", "", "", "科教资源全国最丰富：北京高校与科研机构密集，考研、留学、职业资格、素质教育需求旺盛，教培监管严格。重点核：①办学许可证；②预收费监管账户；③师资资质与稳定性。"], ["医疗健康服务", "医疗与生物医药产业强（生物医药为攻坚产业之一），高端民营医疗、口腔、体检、医美发达；居民支付能力强，商业保险合作机会多", "", "", "", "全国顶级医疗资源：北京三甲医院数量全国第一，民营医院、专科诊所、口腔与医美机构数量多且层次高。重点核：①医疗机构执业许可证；②医护人员资质；③诊疗记录与收费凭证。"], ["文化旅游与休闲娱乐", "历史文化名城：2025年接待游客20052.8万人次，门票与旅游经营收入可观；夫子庙、中山陵、颐和路等带动民宿、文创、研学、演艺；文旅企业规范化程度较高", "", "", "", "历史文化名城与文旅消费：北京是全国顶级文旅目的地，故宫/长城/颐和园等带动文创、民宿、餐饮消费，2025年接待游客约3.3亿人次。重点核：①文旅经营许可；②客流数据与淡旺季；③产权/租约剩余期限。"], ["农业与农产品加工", "都市现代农业：2025年粮食总产量100.8万吨，生猪出栏37.39万头增长5.0%，家禽出栏1741.20万只增长10.1%；高附加值农产品（苗木、水产、有机蔬菜）与休闲农业发达，服务城市消费", "", "", "", "都市现代农业与精品农业：北京农业占比极低，以精品农业、观光农业、农产品加工配送为主，服务城市消费。重点核：①土地/大棚租约；②食品经营许可证；③商超/电商供货记录。"], ["人力资源与劳务派遣", "服务业与科技业用工为主（软件、金融、物业、餐饮），高端人才派遣与灵活用工发展快；用工合规与社保要求最严格", "", "", "", "高端人才服务与科技外包：北京以高端人才寻访、科技外包、灵活用工为主，服务业用工需求大，制造业用工需求小。重点核：①劳务派遣经营许可证；②客户结构与回款；③代收代发工资流水甄别。"], ["汽车后市场（维修/配件/二手车）", "高端车与新能源车占比高，维修技术要求与客单价高；新能源车三电维修是新兴赛道；保险事故车合作规范", "", "", "", "高端车与新能源车为主：北京豪华车保有量高，新能源车渗透率全国领先，维修技术要求与客单价高，二手车交易活跃。重点核：①机动车维修经营备案；②环保合规（危废/喷漆房）；③配件采购渠道。"], ["◆ 总体判断与行业升降（来自 05_行业分层框架(四城)）", "", "", "", "", ""], ["总体判断", "GDP 9729.07亿元、同比增5.3%（南京市统计局7月28日发布），增速高于全国（4.7%）和全省（5.2%），居全国城市第10位。二产2926.82亿元增3.0%、规上工业增4.1%；三产6686.54亿元增6.3%；规上装备制造业增5.9%、高技术制造业增14.5%；37个工业大类中31个增长（增长面83.8%）；规上服务业营收增7.0%、生产性服务业贡献率80.6%\n\n【展业主线·授信动作】四城中增速第二、结构最优，适合做质量。展业主线：软件与信息技术服务、智能电网与集成电路配套、高技术制造、生产性服务业\n\n【口径·备注】唯一隐忧是消费端偏弱：上半年社零4363.83亿元、下降0.5%。消费类小微要看实际客流，不宜按宏观增速放量", "", "", "", "城市基本面（2026年上半年）"], ["上升行业", "①高技术制造业增加值增14.5%（渝宁晋三城最快）；②集成电路产量增37.2%、新能源汽车产量增44.1%、工业机器人产量增18.8%、服务机器人增269.7%；③软件和信息服务业：2025年收入约1.02万亿元、为全市首个万亿级集群，从业人员约90万人，2026年推进\"人工智能+软件\"；④智能电网（新型电力）为国家首批25个先进制造业集群之一，2025年规模突破5000亿元；⑤生产性服务业营收增7.0%、贡献率80.6%\n\n【展业主线·授信动作】A-B级为主。软件IT服务、集成电路与智能电网配套、机器人与高端装备配套是南京最具辨识度的优质客群，可用知识产权质押、订单与应收账款融资\n\n【口径·备注】南京的上升行业全部有上半年产量或营收数据支撑。软件小微的核心风险不是行业不行，而是\"工资月付、项目回款在验收后\"的垫资错配，期限设计要跟着合同节点走", "", "", "", "上升（景气向上，可倾斜资源）"], ["下降或承压行业", "①社零下降0.5%，消费端偏弱：传统零售、百货、服装门店客流与销售额承压；②建筑业表现不佳、拉低二产增速（2025年固投下降4.9%，扣除房地产开发投资后增2.4%）；③房地产开发链条下行传导至装饰、建材、家具、家电；④学科类培训受政策限制；⑤餐饮住宿虽有文旅客流支撑（2025年接待游客20052.8万人次），但竞争与成本压力大\n\n【展业主线·授信动作】消费零售类降为C-D级，重点看门店实际流水与租约；房建与装饰类D级，核在手订单与应收账龄；文旅类看OTA真实经营数据\n\n【口径·备注】南京人均收入四城最高（2025年78243元），高端消费与文旅仍有机会，但上半年社零负增长说明总量端在收缩，要做结构不做总量", "", "", "", "下降/承压（须严控）"], ["◆ 本城 70 行业风险层级分布（来自 _idx，层级列=第 15+2×序号 列）", "", "", "", "", ""], ["A级·低风险", "3", "4.3%", "优先配置资源。可做信用类、订单与应收账款质押、知识产权质押；额度可适当放大，审批流程从简", "", ""], ["B级·中低风险", "37", "52.9%", "择优拓展。额度与期限按真实回款节奏匹配，落实对应风控措施后可正常推进", "", ""], ["C级·中等风险", "29", "41.4%", "审慎控额。以真实经营流水与硬指标为主要依据，额度从严，期限宜短，原则上要求有效担保", "", ""], ["D级·中高风险", "1", "1.4%", "严控新增、压缩存量。确需介入的必须有强担保（足额抵押或强保证），且回款来源明确可锁定", "", ""], ["E级·高风险", "0", "0.0%", "原则上回避。存量逐步退出", "", ""], ["合计（应=70）", "70", "若合计不等于 70，请检查 _idx 中本城层级列（第 15+2×序号 列）是否 70 行齐全。", "", "", ""], ["◆ 本城政策工具与拓客清单（依据 05/07/08 表数据整理）", "", "", "", "", ""], ["获客主线", "软件与信息技术服务是最大特色客群（软件业务收入约1.02万亿元、从业人员约90万人，中国（南京）软件谷为核心）；集成电路与智能电网配套集聚于雨花台、江北新区、江宁（三区合占全市IC营收约75%）；高技术制造业增加值增14.5%、集成电路产量增37.2%、新能源汽车产量增44.1%。", "", "", "", ""], ["尽调要点", "软件类小微核心风险是\"工资月付、项目回款在验收后\"的垫资错配（6-24个月），须核在手合同节点、人员社保与政府类客户预算落地；消费零售上半年社零4363.83亿元、下降0.5%，做结构不做总量，重点核门店实际客流。", "", "", "", ""], ["政策工具", "科技型与专精特新小微适用知识产权质押、订单与应收账款融资；2025年人均收入78243元为四城最高，高端消费与文旅仍有结构性机会；高校与科研院所成果转化创业活跃。", "", "", "", ""], ["风险提示", "传统零售、百货、服装门店客流承压，降为C-D级；房建与装饰D级，建筑业表现不佳拖累二产增速，须核在手订单与应收账龄；消费类不宜按宏观增速放量。", "", "", "", ""]], "重庆": [["30  城市档案 · 重庆（公式联动 05/07/08/_idx，随看板所选行业请回 22 表看层级）", "", "", "", "", ""], ["城市序号（=22表A列）", "1", "城市名称", "重庆", "表名自检（=22表P列）", "30_城市档案·重庆"], ["用法：本表按 B2 城市序号（与 22_城市选择·搜索勾选 表 A 列序号一致）公式联动 05/07/08/_idx 四张表，无需手工维护。新增城市三步：①在 22 表 A 列补序号、B 列补城市名、C 列补定位标签，并在 _idx 按\"层级/依据\"成对补两列；②复制本表，改名为 22 表 P 列显示的名称；③把 B2 改为新序号，全表自动更新。", "", "", "", "", ""], ["◆ 城市画像（来自 07_城市画像·四城对比，本城列自动定位）", "", "", "", "", ""], ["经济总量与增速（2026年上半年最新）", "上半年地区生产总值16702.17亿元，同比增长4.2%（来源：重庆市统计局2026年7月21日发布）；2025年全年33757.93亿元、增长5.3%。一季度GDP7923.49亿元、增长4.5%，二季度增速小幅回落", "", "", "", "52,073.4亿元"], ["三次产业结构（2026年上半年）", "4.2 : 33.8 : 62.0。第一产业增加值705.16亿元增长4.1%，第二产业5649.04亿元增长2.2%，第三产业10347.97亿元增长5.3%、占GDP超六成，是稳增长主力", "", "", "", "5.4%"], ["支柱产业集群（含2026年上半年增长）", "\"33618\"现代制造业集群：上半年智能装备及智能制造集群增加值增长10.5%、新一代电子信息制造增长7.4%、智能网联新能源汽车增长5.8%，AI及机器人产业增长34.9%；摩托车上半年产量572.77万辆、增长49.7%（2025年全年785.7万辆居全国城市第一）；火锅餐饮2025年收入2470.34亿元、全国首个破2000亿元", "", "", "", "86.0%"], ["民营与小微经济特征（重庆/南京/太原为2025年口径，青岛为2026年上半年）", "2025年民营经济增加值20792.00亿元，占全市经济总量61.6%（来源：重庆市2025年统计公报解读）。餐饮在营市场主体19.5万家，以个体户为主，\"小散弱\"特征明显，产业集中度低", "", "", "", "约1.5万亿元"], ["人口与消费市场（消费为2026年上半年，人口为2025年末）", "常住人口超3000万（全市域，含大量区县农村人口），城镇化率约72%；上半年社会消费品零售总额8491.38亿元、增长2.3%，其中餐饮收入1002.48亿元、增长2.1%；体育娱乐用品零售增长22.5%、通讯器材增长12.6%，消费升级明显", "", "", "", "2,184.3万人"], ["投资与建筑业景气度（2025年全年与2026年上半年混合口径）", "2025年建筑业增加值2762.83亿元；工业企业技术改造投资增长19.2%；上半年规上工业增加值增长4.1%，工业投资保持增长（2026年上半年固投分项数据尚未完整发布）", "", "", "", "87.6%"], ["代表性小微行业", "①火锅及食材供应链（火锅相关企业约1.89万家、门店3.96万家，带动上下游产值突破3000亿元，合川火锅食材产业园集聚上百家小微加工企业）；②汽车摩托车零部件配套（规上零部件企业410余家，燃油摩托本地配套率超80%）；③小面、江湖菜等大众餐饮；④建筑劳务与建材贸易；⑤长江上游物流与跨境电商（依托西部陆海新通道）", "", "", "", "数字经济、金融、科技服务、文化创意"], ["空间集聚分布（重点园区与市场）", "两江新区（整车制造、电子信息）、永川高新区与巴南工业园（乘用车）、涪陵经开区与璧山高新区（动力电池）、荣昌高新区（汽车内外饰）、大渡口区（摩托赛事与新能源摩托）、合川区（火锅食材产业园）、渝西地区（电动摩托车引领）", "", "", "", "科创小微密集、文化创意活跃、专业服务发达"], ["四城核心差异总结", "定位：西部制造业重镇+国际消费中心城市。特征：工业底盘厚（二产33.8%）、民营经济活跃（61.6%）、消费旺盛（餐饮全国第一、上半年社零仍正增长）、外向度高（摩托出口占全国77.8%、西部陆海新通道）。小微画像：制造配套型+消费服务型双主线，量大面广", "", "", "", "租金成本高、产业外迁压力、科创企业估值波动"], ["当地授信策略要点", "①顺着汽车摩托主机厂供应链做上下游小微（核心企业增信），上半年摩托、机器人配套景气度高；②火锅食材供应链是特色赛道，关注合川等产业园集聚客户，旺季（春节前）备货资金需求集中；③餐饮小微客群庞大且社零仍正增长，以经营流水+门店租约+烟草/食品许可为主要核验手段；④建筑劳务与建材贸易需重点核查应收账款账龄与政府类客户付款能力；⑤关注西部陆海新通道带来的跨境贸易与物流小微机会", "", "", "", "重点关注科创园区、文创园区、专业服务楼宇"], ["【数据性质与口径说明】", "本表重庆数据：2026年上半年数据来源于重庆市统计局、国家统计局重庆调查总队《2026年上半年重庆市经济运行情况》（2026年7月21日发布）及一季度数据（4月20日发布）；2025年全年数据来源于《2025年重庆市国民经济和社会发展统计公报》及解读。均为公开统计数据", "", "", "", "2025年北京市统计局发布数据"], ["◆ 行业差异（来自 08_城市行业差异交叉表，17 个重点行业）", "", "", "", "", ""], ["建筑施工总承包", "市场容量大：2025年建筑业增加值2762.83亿元。基建、工业厂房（技改投资增长19.2%）、城市更新与老旧小区改造需求持续。山地地形带来边坡支护、地基处理等专项工程机会，造价高于平原地区", "", "", "", "房建受控但基建持续：非首都功能疏解背景下建筑规模受控，但城市更新与轨道交通持续投入，市政项目稳定。重点核：①项目是否在京内及周边；②是否参与市政/轨交项目；③建造师社保与注册单位一致性。"], ["建筑劳务分包", "劳动力资源丰富且本地建筑劳务企业多，承接本地及外出（云贵川、沿海）工程；农民工工资专户管理执行严格", "", "", "", "劳务成本高且外来劳务多：北京建筑工人薪资水平全国领先，劳务队伍多来自河北/河南/山东，用工合规要求严格。重点核：①农民工工资专户；②劳务分包合同；③社保缴纳情况。"], ["建材贸易（钢材/水泥/砂石）", "砂石资源受长江与山区河道管理影响，本地砂石价格与供给波动大；钢材主要靠外部输入，物流成本占比高", "", "", "", "高端建材与绿色建材为主：北京严控高耗能产业，本地建材产能少，主要从河北/天津输入，绿色建材和装配式建材需求增长。重点核：①进货渠道与运输凭证；②是否有市政/国企合格供方资质。"], ["机械加工与零部件制造", "汽车摩托车配套为主导：2025年汽车产量278.8万辆（重回全国城市首位）、摩托车785.7万辆（全国城市第一），规上摩托车零部件企业410余家，燃油摩托本地配套率超80%。小微机加工厂订单稳定但账期长（60-120天承兑），毛利偏低", "", "", "", "高端制造与精密加工：北京制造业向高端化、智能化转型，航空航天、精密仪器、智能制造装备配套需求大。重点核：①是否为高端制造配套；②研发投入与技术人员占比。"], ["食品加工制造", "火锅食材是标志性赛道：火锅相关企业约1.89万家、门店3.96万家，带动上下游产值突破3000亿元；合川火锅食材产业园集聚上百家小微加工企业。另有小面调料、榨菜、江湖菜预制菜。原料（辣椒、花椒、牛油）季节性收购资金需求集中", "", "", "", "都市食品与中央厨房：北京以烘焙、乳品、休闲食品、餐饮中央厨房为主，供应链服务商超与电商发达。重点核：①食品经营许可证；②商超/电商进场记录；③冷链物流凭证。"], ["餐饮住宿服务", "全国餐饮第一城：2025年餐饮收入2470.34亿元（全国首个突破2000亿元），占社零14.8%，在营市场主体19.5万家，餐饮门店数量居全国城市之首。火锅、小面、江湖菜品类丰富，客单价梯度全，夜经济与旅游客流旺盛", "", "", "", "高端餐饮与文旅餐饮为主：北京餐饮消费层次丰富，高端餐饮、老字号、文旅餐饮特色突出，2025年餐饮收入约1300亿元。重点核：①食品经营与消防；②房租合同与流水；③点评/外卖数据。"], ["软件与信息技术服务", "以工业软件、汽车软件（智能座舱、智能驾驶）、大数据与人工智能应用为主，服务本地制造业数字化转型；\"两院一湾\"（人工智能学院、通用人工智能研究院、人工智能湾区）带动生态", "", "", "", "全国最强科创与互联网集聚：北京是全国互联网与科创中心，软件与IT服务企业数量多、层次高，字节/百度/京东等龙头带动生态。重点核：①核心技术人员稳定性；②项目合同与回款周期；③知识产权与软著数量。"], ["物流货运", "多式联运枢纽：长江上游航运中心+西部陆海新通道+中欧班列，跨境与大宗物流机会多；山地地形使短驳与城配成本高", "", "", "", "首都物流枢纽与消费配送：北京物流以消费配送、电商快递、航空货运为主，干线物流受货车限行政策影响大。重点核：①道路运输许可证；②车辆通行证件；③配送合同与路线。"], ["新能源与光伏安装", "动力电池产业规模大（涪陵、璧山为基地），新能源汽车产业链完整；分布式光伏受山地与光照条件限制，工商业屋顶资源相对有限", "", "", "", "分布式光伏与绿电交易：北京大力推进分布式光伏和建筑光伏一体化，绿电交易活跃，但户用光伏受建筑形态限制。重点核：①承装（修、试）电力设施许可证；②屋顶产权与租约；③并网验收文件。"], ["再生资源与环保", "汽车拆解与废钢资源丰富（汽车摩托车产量大），长江水运便于废料集散；环保要求高（长江大保护）", "", "", "", "电子废弃物与危废处理：北京科创企业多，电子废弃物与工业危废处理需求大，环保合规要求全国最严。重点核：①危险废物经营许可证；②环保审批文件；③处置台账与联单。"], ["商贸批发零售", "辐射西南的批发集散中心，朝天门等老牌批发市场体量巨大；消费品市场活跃（社零规模西部前列），跨境电商依托通道优势发展", "", "", "", "高端消费与专业服务：北京是全国高端消费中心，奢侈品、文创产品、专业服务需求旺盛，批发向品牌化转型。重点核：①品牌授权/代理协议；②销售流水与会员数据；③库存周转与账期。"], ["教育与职业培训", "高校与职业院校资源丰富，职业教育与技能培训需求大（制造业用工）；学科类培训受政策限制，素质类与职业类是主流", "", "", "", "科教资源全国最丰富：北京高校与科研机构密集，考研、留学、职业资格、素质教育需求旺盛，教培监管严格。重点核：①办学许可证；②预收费监管账户；③师资资质与稳定性。"], ["医疗健康服务", "医疗资源西部领先，民营医院、专科诊所、口腔与医美机构数量多；医保定点资格是客源关键", "", "", "", "全国顶级医疗资源：北京三甲医院数量全国第一，民营医院、专科诊所、口腔与医美机构数量多且层次高。重点核：①医疗机构执业许可证；②医护人员资质；③诊疗记录与收费凭证。"], ["文化旅游与休闲娱乐", "网红旅游城市：洪崖洞、解放碑、长江索道等带动民宿、餐饮、文创、旅拍爆发式增长；夜经济与文旅融合度高，小微文旅主体量大", "", "", "", "历史文化名城与文旅消费：北京是全国顶级文旅目的地，故宫/长城/颐和园等带动文创、民宿、餐饮消费，2025年接待游客约3.3亿人次。重点核：①文旅经营许可；②客流数据与淡旺季；③产权/租约剩余期限。"], ["农业与农产品加工", "山地特色农业：柑橘、花椒、辣椒、榨菜、茶叶、生态畜牧；火锅食材原料（辣椒、花椒、牛油）本地及周边供给形成产业链；丘陵地形使机械化率低、人工成本高", "", "", "", "都市现代农业与精品农业：北京农业占比极低，以精品农业、观光农业、农产品加工配送为主，服务城市消费。重点核：①土地/大棚租约；②食品经营许可证；③商超/电商供货记录。"], ["人力资源与劳务派遣", "制造业用工需求大（汽车、电子信息、摩托车），劳务派遣与外包市场活跃；旺季用工波动明显", "", "", "", "高端人才服务与科技外包：北京以高端人才寻访、科技外包、灵活用工为主，服务业用工需求大，制造业用工需求小。重点核：①劳务派遣经营许可证；②客户结构与回款；③代收代发工资流水甄别。"], ["汽车后市场（维修/配件/二手车）", "汽车保有量大且本地产业链完整，配件供应便利价格低；维修与美容市场竞争激烈；二手车流通活跃", "", "", "", "高端车与新能源车为主：北京豪华车保有量高，新能源车渗透率全国领先，维修技术要求与客单价高，二手车交易活跃。重点核：①机动车维修经营备案；②环保合规（危废/喷漆房）；③配件采购渠道。"], ["◆ 总体判断与行业升降（来自 05_行业分层框架(四城)）", "", "", "", "", ""], ["总体判断", "GDP 16702.17亿元、同比增4.2%（重庆市统计局7月21日发布）。二产增加值5649.04亿元增2.2%，三产10347.97亿元增5.3%；规上工业增加值增4.1%；社零8491.38亿元增2.3%、其中餐饮收入1002.48亿元增2.1%；半年居民人均可支配收入23127元增4.6%\n\n【展业主线·授信动作】四城中体量最大、消费与投资仍有正增长，适合做规模。展业主线：制造配套（顺着汽车摩托车产业链）+ 大众消费（餐饮零售）+ 通道物流\n\n【口径·备注】一季度增4.5%、上半年增4.2%，增速略有回落但仍处合理区间。民营经济占比61.6%（2025年），小微客群基数大、活力强", "", "", "", "城市基本面（2026年上半年）"], ["上升行业", "①摩托车：上半年产量572.77万辆、同比增49.7%，出口占比高，配套零部件需求旺；②智能装备及智能制造集群增10.5%、AI及机器人增34.9%；③新一代电子信息制造增7.4%（液晶显示屏增9.7%、集成电路圆片增20.4%）；④智能网联新能源汽车增5.8%，锂离子电池产量增63.2%；⑤餐饮：收入1002.48亿元增2.1%，火锅产业链上下游产值超3000亿元；⑥消费升级品类：体育娱乐用品零售增22.5%、通讯器材增12.6%\n\n【展业主线·授信动作】A-B级为主。摩托车与汽车零部件配套、火锅食材供应链、大众餐饮、通道物流与跨境电商可重点拓展\n\n【口径·备注】重庆的上升行业有明确的产量与增速数据支撑，不是概念。顺着33618集群的核心企业找上下游小微，是最有效的获客路径", "", "", "", "上升（景气向上，可倾斜资源）"], ["下降或承压行业", "①二产增速2.2%低于三产，传统制造与建筑承压；②房地产相关链条（房建、装饰、建材、家具）受开发投资下行影响，订单与回款双双承压；③成品油零售受新能源车渗透影响长期销量下行（2025年新能源汽车产量129.6万辆增36%）；④低端过剩制造与传统批发市场受电商分流\n\n【展业主线·授信动作】D级为主。房建与装饰、建材贸易须核在手订单与应收账龄；传统批发市场关注客流下滑；加油站关注长期需求替代\n\n【口径·备注】重庆建筑业2025年增加值2762.83亿元仍有规模，但增速与回款质量需逐户核查，政府类与房企类客户分开对待", "", "", "", "下降/承压（须严控）"], ["◆ 本城 70 行业风险层级分布（来自 _idx，层级列=第 15+2×序号 列）", "", "", "", "", ""], ["A级·低风险", "0", "0.0%", "优先配置资源。可做信用类、订单与应收账款质押、知识产权质押；额度可适当放大，审批流程从简", "", ""], ["B级·中低风险", "35", "50.0%", "择优拓展。额度与期限按真实回款节奏匹配，落实对应风控措施后可正常推进", "", ""], ["C级·中等风险", "34", "48.6%", "审慎控额。以真实经营流水与硬指标为主要依据，额度从严，期限宜短，原则上要求有效担保", "", ""], ["D级·中高风险", "1", "1.4%", "严控新增、压缩存量。确需介入的必须有强担保（足额抵押或强保证），且回款来源明确可锁定", "", ""], ["E级·高风险", "0", "0.0%", "原则上回避。存量逐步退出", "", ""], ["合计（应=70）", "70", "若合计不等于 70，请检查 _idx 中本城层级列（第 15+2×序号 列）是否 70 行齐全。", "", "", ""], ["◆ 本城政策工具与拓客清单（依据 05/07/08 表数据整理）", "", "", "", "", ""], ["获客主线", "顺着汽车摩托主机厂与\"33618\"集群供应链做上下游小微（2026年上半年摩托车产量572.77万辆、同比增49.7%，智能装备及智能制造集群增10.5%）；火锅食材供应链是特色赛道（合川产业园集聚上百家小微加工企业）；长江上游航运中心+西部陆海新通道+中欧班列的多式联运枢纽，跨境与大宗物流机会多。", "", "", "", ""], ["尽调要点", "建筑类客户依托城市更新与工业技改（技改投资增19.2%），须核在手订单与付款来源，政府类与房企类分开对待；消费零售上半年社零8491.38亿元、增2.3%，餐饮收入全国第一，可批量拓展，重点核门店流水与平台数据；山地地形使短驳与城配成本高，物流类定价需覆盖成本。", "", "", "", ""], ["政策工具", "民营经济占比61.6%（2025年），小微客群基数大、活力强，适合批量拓展；国际消费中心城市建设持续推进，餐饮与消费类政策连续性高；两江新区、永川、涪陵、璧山、荣昌等园区是产业金融主战场。", "", "", "", ""], ["风险提示", "房地产开发链条（房建、装饰、建材、家具）受开发投资下行影响，订单与回款双双承压；成品油与传统批发市场面临长期需求替代；D级客户必须核在手订单真实性与应收账龄。", "", "", "", ""]], "青岛": [["33  城市档案 · 青岛（公式联动 05/07/08/_idx，随看板所选行业请回 22 表看层级）", "", "", "", "", ""], ["城市序号（=22表A列）", "4", "城市名称", "青岛", "表名自检（=22表P列）", "33_城市档案·青岛"], ["用法：本表按 B2 城市序号（与 22_城市选择·搜索勾选 表 A 列序号一致）公式联动 05/07/08/_idx 四张表，无需手工维护。新增城市三步：①在 22 表 A 列补序号、B 列补城市名、C 列补定位标签，并在 _idx 按\"层级/依据\"成对补两列；②复制本表，改名为 22 表 P 列显示的名称；③把 B2 改为新序号，全表自动更新。", "", "", "", "", ""], ["◆ 城市画像（来自 07_城市画像·四城对比，本城列自动定位）", "", "", "", "", ""], ["经济总量与增速（2026年上半年最新）", "上半年地区生产总值9138.18亿元、同比增长5.5%，高于全国0.8个百分点（来源：青岛市统计局《2026年上半年全市经济运行情况》，2026年7月24日发布）。第一产业236.93亿元增长3.7%、第二产业2926.72亿元增长4.0%、第三产业5974.53亿元增长6.4%，服务业占GDP 65.4%；规上工业增加值增长7.3%，35个大类中29个增长、增长面82.9%", "", "", "", "52,073.4亿元"], ["三次产业结构（2026年上半年）", "2.6 : 32.0 : 65.4。第一产业增加值236.93亿元增长3.7%（农林牧渔总产值398.8亿元、增长4.1%），第二产业2926.72亿元增长4.0%（规上工业增长7.3%），第三产业5974.53亿元增长6.4%、占比65.4%；交通运输仓储邮政业增加值增长10.6%、批发和零售业增长8.7%为三产主力", "", "", "", "5.4%"], ["支柱产业集群（含2026年上半年增长）", "智能装备、轨道交通装备（中车四方）、智能家电（海尔、海信）、高端化工与新材料（国橡中心功能性新材料产业园）、汽车与新能源汽车（一汽大众、上汽通用青岛基地，省十五五规划定济南/青岛双基地）；上半年专用设备、通用设备、汽车、橡胶和塑料制品业均两位数增长，传感器产量增长83.8%、集成电路圆片增长60.7%、虚拟现实设备增长30.6%；1-5月规上服务业营收中互联网和相关服务增长24.0%；海洋生产总值增长21.9%", "", "", "", "86.0%"], ["民营与小微经济特征（重庆/南京/太原为2025年口径，青岛为2026年上半年）", "民营经济是青岛外贸与就业的双主力：上半年民营企业进出口3463.7亿元、增长9.8%、占全市进出口总值74.1%；1-6月城镇新增就业18.09万人，其中民营经济吸纳16.39万人、占90.6%。6月末全市本外币存款32778.1亿元增长8.8%、贷款35289.8亿元增长5.6%；已发放支农支小和民营企业再贷款263亿元、落地全省首批民营企业再贷款48亿元；金融“五篇大文章”贷款余额1.36万亿元", "", "", "", "约1.5万亿元"], ["人口与消费市场（消费为2026年上半年，人口为2025年末）", "上半年社会消费品零售总额3370.9亿元、增长2.8%；智能手机零售增长20.2%、新能源汽车增长18.2%；公共网络零售额增长17.1%、占限上零售额44.5%。居民消费价格同比上涨1.0%，其中食品烟酒及在外餐饮上涨0.2%、居住价格持平、生活用品及服务上涨2.4%、医疗保健下降0.3%；一般公共预算支出中民生支出占76.5%", "", "", "", "2,184.3万人"], ["投资与建筑业景气度（2025年全年与2026年上半年混合口径）", "固定资产投资结构分化明显：上半年仅交通运输仓储和邮政业投资增长1.0%、金融业投资增长5.8%两个行业正增长，房地产与建安链条仍在收缩；但重大项目清单充足——105个城中村改造、2026年计划完成回迁安置项目18个（5月底已8个项目分钥匙）、胶州湾第二隧道加快施工、双山隧道开工、沈海高速改扩建全线通车、董家口至五莲铁路开工、建成50条市政道路、官路水库主体工程全面完工、官路水库输配水工程（一期）总投资77.99亿元、新增公共停车泊位5000个以上", "", "", "", "87.6%"], ["代表性小微行业", "①港口物流与货代报关（青岛港货物吞吐量3.73亿吨增长3.2%、集装箱1822万TEU增长7.0%、外贸航线近240条居北方首位）；②家电与轨道交通装备制造配套（中车四方智汇港一期、青特智能制造产业园）；③橡胶轮胎与功能性新材料配套（赛轮、双星、森麒麟与国橡中心项目）；④水产养殖与预制菜冷链（上半年水产品产量43.0万吨增长4.5%、海洋生产总值增长21.9%）；⑤跨境电商与外贸市场（民营企业进出口占74.1%）；⑥啤酒饮料与海鲜特色餐饮及民宿", "", "", "", "数字经济、金融、科技服务、文化创意"], ["空间集聚分布（重点园区与市场）", "西海岸新区/黄岛（港口、石化、家电与汽车基地、董家口港区）、胶州上合示范区与临空经济区（跨境贸易、空港物流）、即墨（针织服装、水产与海洋科技、汽车）、城阳（轨道交通装备、装备制造与汽车零部件）、崂山（科创大走廊、互联网与软件、虚拟现实）、李沧与市北（商贸与城市更新、总部经济）、平度与莱西（家电与橡胶配套、种植与养殖、食品加工）", "", "", "", "科创小微密集、文化创意活跃、专业服务发达"], ["四城核心差异总结", "定位：北方外向型制造业与港口物流枢纽+海洋中心城市。特征：工业增长快（规上工业+7.3%）、外向度极高（进出口+5.7%、民营占74.1%）、海洋与港口资源全国独有、服务业占比65.4%；短板是消费总量温和（社零+2.8%）与房地产开发投资持续收缩。小微画像：制造配套型+口岸物流型+海洋特色型三主线，出口导向、有真实货盘的小微质量最高", "", "", "", "租金成本高、产业外迁压力、科创企业估值波动"], ["当地授信策略要点", "①顺着中车四方、海尔海信、一汽大众青岛基地、赛轮双星的合格供方名录做上下游小微（青岛最主流的获客与增信路径）；②港口与跨境类是特色优质赛道，可重点拓展货代、报关、冷链、跨境电商，须核航线运量与收汇凭证；③建筑类按客户性质严格分层：城中村改造、胶州湾第二隧道、官路水库输配水等政府与平台类项目可做（B-C级），住宅与商办链条严控（D级）；④消费零售类仅温和复苏（社零+2.8%、网络零售占限上44.5%），以门店实际流水为准，不跟宏观放量；⑤用好本地政策工具：小微企业融资协调机制已走访53万户、助力获贷超5400亿元居全省首位，为1.2万余户办理无还本续贷245.8亿元；青融通累计助1.89万家企业融资4632.78亿元；“47条”助力小店经济提供个体益贷、经营快贷、订单贷与餐饮文旅等8大领域专项贴息；309个金融服务驿站与9.1万户推荐清单已授信6625.7亿元、放贷4932.5亿元、平均利率3.42%", "", "", "", "重点关注科创园区、文创园区、专业服务楼宇"], ["【数据性质与口径说明】", "本表青岛数据：2026年上半年数据来源于青岛市统计局、国家统计局青岛调查队《2026年上半年全市经济运行情况》（2026年7月24日发布，青岛政务网）、青岛市的港口与外贸公开发布数据及青岛市税务局、人民银行青岛市分行相关公开披露。均为①类公开统计数据", "", "", "", "2025年北京市统计局发布数据"], ["◆ 行业差异（来自 08_城市行业差异交叉表，17 个重点行业）", "", "", "", "", ""], ["建筑施工总承包", "结构性分化：市政公用、水利与交通类订单充足（105个城中村改造、胶州湾第二隧道加快施工、双山隧道开工、沈海高速改扩建全线通车、董家口至五莲铁路开工、建成50条市政道路、官路水库主体工程全面完工、输配水工程一期投资77.99亿元），付款方以市区级平台为主；而上半年固定资产投资中房地产开发与建安链条未见改善，住宅类总包新签萎缩、垫资与应收风险高", "", "", "", "房建受控但基建持续：非首都功能疏解背景下建筑规模受控，但城市更新与轨道交通持续投入，市政项目稳定。重点核：①项目是否在京内及周边；②是否参与市政/轨交项目；③建造师社保与注册单位一致性。"], ["建筑劳务分包", "上半年城镇新增就业18.09万人、民营经济吸纳16.39万人，用工需求整体活跃；但住宅新开工不足使本地班组开工率不均，且青岛对工资专户与社保核查严格。重点核工资专户、保证金凭证与花名册流水一致性", "", "", "", "劳务成本高且外来劳务多：北京建筑工人薪资水平全国领先，劳务队伍多来自河北/河南/山东，用工合规要求严格。重点核：①农民工工资专户；②劳务分包合同；③社保缴纳情况。"], ["建材贸易（钢材/水泥/砂石）", "本地无大型钢厂，钢材依靠港口与铁路输入；上半年青岛港干散杂货吞吐量1.18亿吨、下降7.5%，反映大宗建材到港量收缩。需求集中在政府类项目与城中村改造，须防范以建材贸易为名的资金拆借与融资性贸易", "", "", "", "高端建材与绿色建材为主：北京严控高耗能产业，本地建材产能少，主要从河北/天津输入，绿色建材和装配式建材需求增长。重点核：①进货渠道与运输凭证；②是否有市政/国企合格供方资质。"], ["机械加工与零部件制造", "四城中订单确定性最强：上半年规上工业增加值增长7.3%，专用设备、通用设备、汽车、橡胶和塑料制品业均两位数增长；传感器产量增长83.8%、集成电路圆片增长60.7%。配套对象是中车四方、海尔海信、一汽大众青岛基地与赛轮双星，进入合格供方名录是核心准入条件", "", "", "", "高端制造与精密加工：北京制造业向高端化、智能化转型，航空航天、精密仪器、智能制造装备配套需求大。重点核：①是否为高端制造配套；②研发投入与技术人员占比。"], ["食品加工制造", "海洋与水产加工是绝对特色：上半年水产品产量43.0万吨、增长4.5%，农副食品加工业两位数增长，海洋生产总值增长21.9%、涉海固定资产投资增长15.1%。另有啤酒饮料、本地面点与预制菜（即食海鲜、中央厨房）。核验重点在SC许可品类覆盖、冷库库存与出口注册", "", "", "", "都市食品与中央厨房：北京以烘焙、乳品、休闲食品、餐饮中央厨房为主，供应链服务商超与电商发达。重点核：①食品经营许可证；②商超/电商进场记录；③冷链物流凭证。"], ["餐饮住宿服务", "海鲜与啤酒餐饮、民宿客栈是主线，5-10月旺季强；上半年在外餐饮价格上涨0.2%、批发和零售业增加值增长8.7%，需求稳但不快。特殊风险：海鲜原料价格与供应季节性波动大、旅游旺季一次性收入占比高，测算须用淡季流水做底", "", "", "", "高端餐饮与文旅餐饮为主：北京餐饮消费层次丰富，高端餐饮、老字号、文旅餐饮特色突出，2025年餐饮收入约1300亿元。重点核：①食品经营与消防；②房租合同与流水；③点评/外卖数据。"], ["软件与信息技术服务", "有增长、有场景，但规模远小于南京：上半年1-5月规上服务业中互联网和相关服务增长24.0%、研究和试验发展增长12.9%；虚拟现实设备产量增长30.6%、高端家电与高速列车2个国家制造业创新中心通过验收；崂山科创大走廊与虚拟现实产业园是主要集聚地，客群以工业互联网、智能制造软件与出海应用为主", "", "", "", "全国最强科创与互联网集聚：北京是全国互联网与科创中心，软件与IT服务企业数量多、层次高，字节/百度/京东等龙头带动生态。重点核：①核心技术人员稳定性；②项目合同与回款周期；③知识产权与软著数量。"], ["物流货运", "北方口岸物流核心：上半年交通运输仓储邮政业增加值增长10.6%（全市服务业最快），青岛港货物吞吐量3.73亿吨增长3.2%、集装箱1822万TEU增长7.0%、液体散货0.54亿吨增长8.4%，而干散杂货1.18亿吨下降7.5%。集装箱与外贸货类好于大宗货类，选客户要看货源结构", "", "", "", "首都物流枢纽与消费配送：北京物流以消费配送、电商快递、航空货运为主，干线物流受货车限行政策影响大。重点核：①道路运输许可证；②车辆通行证件；③配送合同与路线。"], ["新能源与光伏安装", "有真实场景：上半年新能源汽车零售增长18.2%、汽车制造业两位数增长，公共停车泊位计划新增5000个以上并同步配建充电设施，鹏辉能源等项目落地；港口岸电与工商业屋顶资源较好。仍须核承装（修、试）许可证、屋顶产权与并网批复", "", "", "", "分布式光伏与绿电交易：北京大力推进分布式光伏和建筑光伏一体化，绿电交易活跃，但户用光伏受建筑形态限制。重点核：①承装（修、试）电力设施许可证；②屋顶产权与租约；③并网验收文件。"], ["再生资源与环保", "报废家电与废旧轮胎资源丰富（海尔海信与轮胎产业总部地）且受益于以旧换新政策，港口便于废料集散；上半年集装箱吞吐量增长7.0%。风险在税务：反向开票政策下的发票链与库存真实性是核查核心，涉危废必须持证", "", "", "", "电子废弃物与危废处理：北京科创企业多，电子废弃物与工业危废处理需求大，环保合规要求全国最严。重点核：①危险废物经营许可证；②环保审批文件；③处置台账与联单。"], ["商贸批发零售", "上半年社零3370.9亿元、增长2.8%，其中智能手机增长20.2%、新能源汽车增长18.2%；公共网络零售额增长17.1%、占限上零售额44.5%（线上渗透率为四城最高一档），实体百货与传统市场承压明显。即墨服装、城阳建材与海鲜市场是主要线下渠道，须看直播与电商转型实际成交", "", "", "", "高端消费与专业服务：北京是全国高端消费中心，奢侈品、文创产品、专业服务需求旺盛，批发向品牌化转型。重点核：①品牌授权/代理协议；②销售流水与会员数据；③库存周转与账期。"], ["教育与职业培训", "制造业与港口用工需求支撑职业培训（上半年城镇新增就业18.09万人），海洋类、航运类与外语类（日韩）培训是青岛特色；高校与职业院校资源集中。核心风险仍是预收费负债与办学许可", "", "", "", "科教资源全国最丰富：北京高校与科研机构密集，考研、留学、职业资格、素质教育需求旺盛，教培监管严格。重点核：①办学许可证；②预收费监管账户；③师资资质与稳定性。"], ["医疗健康服务", "老龄化程度较高、就诊量大：上半年一般公共预算支出中卫生健康支出增长30.9%，CPI中医疗保健价格下降0.3%反映医保控费见效。药店与民营门诊单价受压、靠量支撑，须核医保定点协议与飞行检查记录", "", "", "", "全国顶级医疗资源：北京三甲医院数量全国第一，民营医院、专科诊所、口腔与医美机构数量多且层次高。重点核：①医疗机构执业许可证；②医护人员资质；③诊疗记录与收费凭证。"], ["文化旅游与休闲娱乐", "滨海旅游与节庆经济是主场（国际啤酒节、崂山、栈桥、邮轮母港），叠加口岸商务客流（上半年新增外贸航线15条、国际中转集拼量增长52.6%、青岛国际航运中心全球第12位）。旺季集中5-10月、淡季现金流断档是最大风险，贷款期限须避开淡季集中还本", "", "", "", "历史文化名城与文旅消费：北京是全国顶级文旅目的地，故宫/长城/颐和园等带动文创、民宿、餐饮消费，2025年接待游客约3.3亿人次。重点核：①文旅经营许可；②客流数据与淡旺季；③产权/租约剩余期限。"], ["农业与农产品加工", "上半年农林牧渔总产值398.8亿元、增长4.1%：蔬菜211.6万吨增长3.1%、瓜果26.6万吨增长4.2%、水产品43.0万吨增长4.5%、肉蛋奶58.6万吨增长1.4%（猪牛羊禽肉增长10.6%）。海洋牧场与育苗、胶东蔬菜与苹果、莱西畜牧是主线，水产类须核养殖证与存塘量、灾害与价格双周期", "", "", "", "都市现代农业与精品农业：北京农业占比极低，以精品农业、观光农业、农产品加工配送为主，服务城市消费。重点核：①土地/大棚租约；②食品经营许可证；③商超/电商供货记录。"], ["人力资源与劳务派遣", "上半年城镇新增就业18.09万人、民营经济吸纳16.39万人、占90.6%，制造业与港口用工需求为四城中最旺一档；韩资与外贸企业集聚带来韩语人才与产线外包需求。重点核许可证、代发资金隔离与社保一致性", "", "", "", "高端人才服务与科技外包：北京以高端人才寻访、科技外包、灵活用工为主，服务业用工需求大，制造业用工需求小。重点核：①劳务派遣经营许可证；②客户结构与回款；③代收代发工资流水甄别。"], ["汽车后市场（维修/配件/二手车）", "汽车制造业上半年两位数增长、新能源汽车零售增长18.2%，保有量与出行频次支撑维修、美容与配件；崂山与黄岛4S集聚。新能源维修的高压作业资质与设备投入是新增核查项", "", "", "", "高端车与新能源车为主：北京豪华车保有量高，新能源车渗透率全国领先，维修技术要求与客单价高，二手车交易活跃。重点核：①机动车维修经营备案；②环保合规（危废/喷漆房）；③配件采购渠道。"], ["◆ 总体判断与行业升降（来自 05_行业分层框架(四城)）", "", "", "", "", ""], ["总体判断", "GDP 9138.18亿元、同比增长5.5%，高于全国0.8个百分点（青岛市统计局2026年7月24日发布，全国城市第十二、北方第二）。一产236.93亿元增3.7%、二产2926.72亿元增4.0%、三产5974.53亿元增6.4%、服务业占比65.4%；规上工业增加值增7.3%、35个大类中29个增长（增长面82.9%）；社零3370.9亿元增2.8%；进出口4672.1亿元增5.7%、其中出口2817.2亿元增6.9%；CPI增1.0%；6月末本外币贷款余额35289.8亿元增5.6%\n\n【展业主线·授信动作】四城中增速第二、工业增速第一、外向度最高。展业主线：制造配套（轨道交通装备、智能家电、汽车、橡胶新材料的合格供方名录）+ 口岸物流与跨境电商 + 海洋与水产特色产业链。建筑类只跟政府与平台项目\n\n【口径·备注】青岛的结构性亮点是工业和外贸，短板是消费与投资：上半年固定资产投资仅交通运输仓储邮政业（+1.0%）与金融业（+5.8%）两个行业正增长，住宅建安链条仍在收缩，因此不能按5.5%的整体增速给建筑类小微放量", "", "", "", "城市基本面（2026年上半年）"], ["上升行业", "①工业与制造配套：规上工业增7.3%，专用设备、通用设备、汽车、橡胶和塑料制品业均两位数增长，传感器产量增83.8%、集成电路圆片增60.7%、虚拟现实设备增30.6%；②口岸物流：交通运输仓储邮政业增加值增10.6%，青岛港货物吞吐量3.73亿吨增3.2%、集装箱1822万TEU增7.0%、液体散货增8.4%，外贸航线近240条居北方首位、新增外贸航线15条、国际中转集拼增52.6%、航运中心排名升至全球第12位；③外贸与民营经济：进出口增5.7%、民营企业进出口3463.7亿元增9.8%占74.1%；④海洋经济：海洋生产总值增21.9%、涉海固定资产投资增15.1%、水产品产量43.0万吨增4.5%；⑤生产性服务业：1-5月规上服务业营收增7.9%，互联网和相关服务增24.0%、研究和试验发展增12.9%、商务服务业增12.5%；⑥升级类消费：智能手机零售增20.2%、新能源汽车增18.2%、网络零售占限上44.5%\n\n【展业主线·授信动作】A-B级为主。中车四方与海尔海信与一汽大众与赛轮双星的供应链上下游小微、港口集疏运与货代报关、冷链与预制菜、跨境电商与外贸工厂是青岛最优质的客群，可用订单与应收账款、仓单与知识产权增信\n\n【口径·备注】上升行业全部有上半年产量、吞吐量或营收数据支撑（①类公开统计数据）。政策工具充足：小微融资协调机制走访53万户、获贷超5400亿元居全省首位、为1.2万余户办理无还本续贷245.8亿元；青融通累计助1.89万家企业融资4632.78亿元；“47条”小店经济含8大领域专项贴息；309个金融服务驿站、推荐清单9.1万户、授信6625.7亿元、放贷4932.5亿元、平均利率3.42%", "", "", "", "上升（景气向上，可倾斜资源）"], ["下降或承压行业", "①房地产开发链条：上半年居住类价格与上年持平，投资端仅两个行业正增长，房建、装饰、门窗幕墙、建材贸易、家具需求同步承压；②大宗建材与散货：青岛港干散杂货吞吐量1.18亿吨、下降7.5%，钢材水泥砂石到港量收缩，钢价波动下贸易商易被跌价吞掉利润；③传统实体零售：公共网络零售额占限上44.5%、增长17.1%，线下日用百货与服装门店持续被分流；④低端养殖与过剩产能：猪牛羊禽肉产量增10.6%后猪价周期下行风险显现，饲料与防疫成本上升；⑤成品油零售：新能源汽车零售增18.2%长期替代燃油需求；⑥即时娱乐业态：剧本杀、密室同质化布点、生命周期短\n\n【展业主线·授信动作】D级为主。房建与装饰、门窗幕墙、土石方、建材贸易须核在手订单性质与应收账龄，原则上只做有强担保或政府类付款来源的客户；大宗贸易类对无实体仓储与终端客户的中间商不予介入；实体零售以门店实际流水与租约为准\n\n【口径·备注】青岛的下行集中在住宅投资与大宗建材两端，属于结构性问题而非全市性问题。与太原的区别在于：太原是建筑与消费同时下行，青岛是建筑下行而工业与外贸上行，因此青岛的策略是“换行业不换城市”", "", "", "", "下降/承压（须严控）"], ["◆ 本城 70 行业风险层级分布（来自 _idx，层级列=第 15+2×序号 列）", "", "", "", "", ""], ["A级·低风险", "0", "0.0%", "优先配置资源。可做信用类、订单与应收账款质押、知识产权质押；额度可适当放大，审批流程从简", "", ""], ["B级·中低风险", "41", "58.6%", "择优拓展。额度与期限按真实回款节奏匹配，落实对应风控措施后可正常推进", "", ""], ["C级·中等风险", "22", "31.4%", "审慎控额。以真实经营流水与硬指标为主要依据，额度从严，期限宜短，原则上要求有效担保", "", ""], ["D级·中高风险", "7", "10.0%", "严控新增、压缩存量。确需介入的必须有强担保（足额抵押或强保证），且回款来源明确可锁定", "", ""], ["E级·高风险", "0", "0.0%", "原则上回避。存量逐步退出", "", ""], ["合计（应=70）", "70", "若合计不等于 70，请检查 _idx 中本城层级列（第 15+2×序号 列）是否 70 行齐全。", "", "", ""], ["◆ 本城政策工具与拓客清单（依据 05/07/08 表数据整理）", "", "", "", "", ""], ["获客主线", "顺着中车四方、海尔海信、一汽大众青岛基地、赛轮双星的合格供方名录做上下游小微（最主流的获客与增信路径）；规上工业增7.3%、传感器产 function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icons = {success:'✅', error:'❌', warning:'⚠️', info:'ℹ️'};
  t.innerHTML = '<span>'+(icons[type]||'ℹ️')+'</span><span>'+msg+'</span>';
  document.getElementById('toast').appendChild(t);
  setTimeout(() => {t.style.opacity='0';t.style.transform='translateX(100%)';setTimeout(()=>t.remove(),300);}, 3000);
}

function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('mt').textContent = title;
  document.getElementById('mbody').innerHTML = bodyHtml;
  document.getElementById('mfooter').innerHTML = footerHtml || '';

}
function closeModal() {document.getElementById('mo').classList.remove('show');}

function loadFromStorage() {

function escapeHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escapeAttr(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nl2br(s){if(!s)return'-';return String(s).replace(/\n/g,'<br>');}
function truncate(s,n){if(!s)return'';return s.length>n?s.substring(0,n)+'...':s;}
function sortTable(type,key){if(sortConfig.key===key){sortConfig.dir=-sortConfig.dir;}else{sortConfig.key=key;sortConfig.dir=1;}if(type==='industries')filterIndustries();else if(type==='jobs')filterJobs();else if(type==='city_risks')filterCityRisks();}

function renderPagination(cid,total) {
  const tp = Math.ceil(total/pagination.size);
  if(tp<=1){document.getElementById(cid).innerHTML='<div class="pi tc">'+total+' 条记录</div>';return;}
  let h='<div class="pg"><button onclick="goToPage(1)" '+(pagination.page<=1?'disabled':'')+'>«</button><button onclick="goToPage('+(pagination.page-1)+')" '+(pagination.page<=1?'disabled':'')+'>‹</button>';
  let s=Math.max(1,pagination.page-2),e=Math.min(tp,pagination.page+2);
  if(s>1)h+='<button onclick="goToPage(1)">1</button>';
  if(s>2)h+='<span class="pi">...</span>';
  for(let i=s;i<=e;i++)h+='<button class="'+(i===pagination.page?'active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';
  if(e<tp-1)h+='<span class="pi">...</span>';
  if(e<tp)h+='<button onclick="goToPage('+tp+')">'+tp+'</button>';
  h+='<button onclick="goToPage('+(pagination.page+1)+')" '+(pagination.page>=tp?'disabled':'')+'>›</button><button onclick="goToPage('+tp+')" '+(pagination.page>=tp?'disabled':'')+'>»</button><span class="pi">第'+pagination.page+'/'+tp+'页 (共'+total+'条)</span></div>';
  document.getElementById(cid).innerHTML=h;
}
function goToPage(p){pagination.page=p;if(currentPage==='industries')filterIndustries();else if(currentPage==='jobs')filterJobs();else if(currentPage==='cityrisks')filterCityRisks();}

function filterIndustries() {
  const s=(document.getElementById('ind-search')?.value||'').toLowerCase();
  const cat=document.getElementById('ind-cat')?.value||'';
  let f=DB.industries.filter(r=>{
    if(cat&&r['行业门类']!==cat)return false;
    if(s){const v=(r['行业编号']+r['行业门类']+r['细分行业']+r['典型经营主体形态']).toLowerCase();if(!v.includes(s))return false;}
    return true;
  });
  if(sortConfig.key){f.sort((a,b)=>{const va=a[sortConfig.key]||'',vb=b[sortConfig.key]||'';return va<vb?-sortConfig.dir:va>vb?sortConfig.dir:0;});}
  const total=f.length,start=(pagination.page-1)*pagination.size;
  document.getElementById('ind-tbody').innerHTML=f.slice(start,start+pagination.size).map(r=>`<tr><td class="fb2" style="color:var(--primary)">${r['行业编号']||'-'}</td><td>${r['行业门类']||'-'}</td><td class="fb2">${r['细分行业']||'-'}</td><td class="trc" title="${escapeAttr(r['典型经营主体形态'])}">${r['典型经营主体形态']||'-'}</td><td>${r['毛利率区间']||'-'}</td><td>${r['净利率区间']||'-'}</td><td class="trc" title="${escapeAttr(r['前景趋势判断'])}">${r['前景趋势判断']||'-'}</td><td><button class="btn bo bi" onclick="viewIndustry('${r._id}')">👁</button> <button class="btn bo bi" onclick="editIndustry('${r._id}')">✏️</button> <button class="btn bd-btn bi" onclick="deleteIndustry('${r._id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan="8"><div class="es"><div class="ic">📄</div><p>暂无数据</p></div></td></tr>';
  renderPagination('ind-pg',total);
}

  document.getElementById('content').innerHTML=`<div class="card"><div class="ch"><span class="ct">${escapeHtml(rows[0][0]||'交叉表分析')}</span><button class="btn bo bsm" onclick="exportSheet('cross_table')">📤 导出</button></div><div class="fb"><div class="sb"><input class="in" id="ct-search" placeholder="搜索行业..." oninput="filterCrossTable()"></div></div><div class="tw" id="ct-wrapper"><table><thead><tr>${headers.map((h,i)=>'<th style="'+(i===0?'min-width:120px;':'')+(i===headers.length-1?'min-width:200px;background:#fff3cd;':'')+'">'+escapeHtml(h)+'</th>').join('')}</tr></thead><tbody id="ct-tbody">${dr.map(r=>'<tr>'+r.map((c,i)=>'<td style="'+(i===0?'font-bold;background:#f8fafc;':'')+(i===r.length-1?'background:#fffbeb;':'')+'">'+escapeHtml(c||'')+'</td>').join('')+'</tr>').join('')}</tbody></table></div></div>`;
}
function filterCrossTable(){const s=(document.getElementById('ct-search')?.value||'').toLowerCase();const rows=DB.cross_table;let dr=rows.slice(2).filter(r=>r[0]);if(s)dr=dr.filter(r=>(r[0]||'').toLowerCase().includes(s));document.getElementById('ct-tbody').innerHTML=dr.map(r=>'<tr>'+r.map((c,i)=>'<td style="'+(i===0?'font-bold;background:#f8fafc;':'')+(i===r.length-1?'background:#fffbeb;':'')+'">'+escapeHtml(c||'')+'</td>').join('')+'</tr>').join('');}

// ===== ANALYTICS =====
function renderAnalytics(){
  const cats={};DB.industries.forEach(r=>{const c=r['行业门类']||'未分类';cats[c]=(cats[c]||0)+1;});
  const crm={};const cities=[...new Set(DB.city_risks.map(r=>r['城市']))].filter(Boolean).sort();
  cities.forEach(c=>{const rs=DB.city_risks.filter(r=>r['城市']===c);crm[c]={A:0,B:0,C:0,D:0,E:0};rs.forEach(r=>{const l=(r['城市风险层级']||'').charAt(0);if(l&&crm[c][l]!==undefined)crm[c][l]++;});});
  const jci={};DB.jobs.forEach(j=>{jci[j['行业编号']]=(jci[j['行业编号']]||0)+1;});
  const tj=Object.entries(jci).sort((a,b)=>b[1]-a[1]).slice(0,15);
  document.getElementById('content').innerHTML=`
    <div class="cg"><div class="card"><div class="ch"><span class="ct">行业门类分布（饼图）</span></div><div class="cc"><canvas id="chart-cat2"></canvas></div></div><div class="card"><div class="ch"><span class="ct">职位最多的行业 Top 15</span></div><div class="cc"><canvas id="chart-jobs"></canvas></div></div></div>
    <div class="card"><div class="ch"><span class="ct">各城市风险层级分布（堆叠柱状图）</span></div><div class="cc" style="height:400px"><canvas id="chart-city-risk"></canvas></div></div>
    <div class="card"><div class="ch"><span class="ct">城市风险层级热力矩阵</span></div><div class="tw"><table><thead><tr><th>城市</th><th>A级</th><th>B级</th><th>C级</th><th>D级</th><th>E级</th><th>合计</th></tr></thead><tbody>${cities.map(c=>{const m=crm[c];const t=m.A+m.B+m.C+m.D+m.E;return '<tr><td class="fb2">'+c+'</td><td><span class="badge ba">'+m.A+'</span></td><td><span class="badge bb">'+m.B+'</span></td><td><span class="badge bc">'+m.C+'</span></td><td><span class="badge bd">'+m.D+'</span></td><td><span class="badge be">'+m.E+'</span></td><td class="fb2">'+t+'</td></tr>';}).join('')}</tbody></table></div></div>`;
  setTimeout(()=>{
    const cc=document.getElementById('chart-cat2');if(cc)charts.cat2=new Chart(cc,{type:'pie',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:['#667eea','#f093fb','#4facfe','#43e97b','#fa709a','#fee140','#a8edea','#ffd3a5','#ff9a9e','#adcfeb','#fbc2eb','#a18cd1','#f5576c','#c7ceea']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}}}});
    const jc=document.getElementById('chart-jobs');if(jc)charts.jobs=new Chart(jc,{type:'bar',data:{labels:tj.map(j=>j[0]),datasets:[{data:tj.map(j=>j[1]),backgroundColor:'#4facfe'}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}}}});
    const rc=document.getElementById('chart-city-risk');if(rc){const rcol={A:'#16a34a',B:'#2563eb',C:'#d97706',D:'#ea580c',E:'#dc2626'};charts.cr=new Chart(rc,{type:'bar',data:{labels:cities,datasets:['A','B','C','D','E'].map(l=>({label:l+'级',data:cities.map(c=>crm[c][l]),backgroundColor:rcol[l]}))},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true}}}});}
  },100);
}

// ===== EXPORT =====
function renderExport(){
  document.getElementById('content').innerHTML=`
    <div class="card"><div class="ch"><span class="ct">数据导出中心</span></div><p class="t2 mb4">选择要导出的数据表，点击导出按钮即可下载Excel文件。</p>
    <div class="sg"><div class="sc" style="cursor:pointer" onclick="exportSheet('industries')"><div class="si" style="background:linear-gradient(135deg,#667eea,#764ba2)">🏢</div><div class="sinfo"><h3>${DB.industries.length}</h3><p>行业数据导出</p></div></div><div class="sc" style="cursor:pointer" onclick="exportSheet('jobs')"><div class="si" style="background:linear-gradient(135deg,#f093fb,#f5576c)">👥</div><div class="sinfo"><h3>${DB.jobs.length}</h3><p>职业数据导出</p></div></div><div class="sc" style="cursor:pointer" onclick="exportSheet('city_risks')"><div class="si" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">🏙</div><div class="sinfo"><h3>${DB.city_risks.length}</h3><p>城市风控导出</p></div></div><div class="sc" style="cursor:pointer" onclick="exportAll()"><div class="si" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">📤</div><div class="sinfo"><h3>全部</h3><p>一键导出所有数据</p></div></div></div></div>
    <div class="card"><div class="ch"><span class="ct">其他数据表</span></div><div class="flex fw g2"><button class="btn bo" onclick="exportSheet('tier_framework')">行业分层框架 (${DB.tier_framework.length})</button><button class="btn bo" onclick="exportSheet('city_profiles')">城市画像对比 (${DB.city_profiles.length})</button><button class="btn bo" onclick="exportSheet('cross_table')">交叉表分析 (${DB.cross_table.length})</button><button class="btn bo" onclick="exportSheet('industry_selection')">行业选择表 (${DB.industry_selection.length})</button></div></div>
    <div class="card"><div class="ch"><span class="ct">数据维护</span></div><div class="flex fw g2"><button class="btn bp" onclick="saveToStorage()">💾 保存到本地</button><button class="btn bw" onclick="exportJSON()">🌐 导出JSON备份</button><button class="btn bd-btn" onclick="resetData()">🗑 重置为初始数据</button></div></div>`;
}
function exportSheet(sn){
  let data,sheet,fn;
  if(sn==='industries'){data=DB.industries.map(r=>{const{_id,...rest}=r;return rest;});sheet='行业管理';fn='行业管理.xlsx';}
  else if(sn==='jobs'){data=DB.jobs.map(r=>{const{_id,...rest}=r;return rest;});sheet='职业管理';fn='职业管理.xlsx';}
  else if(sn==='city_risks'){data=DB.city_risks.map(r=>{const{_id,...rest}=r;return rest;});sheet='城市风控';fn='城市风控.xlsx';}
  else if(sn==='tier_framework'){data=DB.tier_framework;sheet='行业分层框架';fn='行业分层框架.xlsx';}
  else if(sn==='city_profiles'){const cs=DB.city_profiles[0]?.values||[];data=DB.city_profiles.slice(1).map(m=>{const r={'对比维度':m.metric};cs.forEach((c,i)=>r[c]=m.values[i]||'');return r;});sheet='城市画像对比';fn='城市画像对比.xlsx';}
  else if(sn==='cross_table'){data=DB.cross_table.map(r=>{const o={};r.forEach((c,i)=>o['col'+i]=c);return o;});sheet='交叉表分析';fn='交叉表分析.xlsx';}
  else if(sn==='industry_selection'){data=DB.industry_selection;sheet='行业选择';fn='行业选择.xlsx';}
  else return;
  const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,fn);toast('已导出 '+fn,'success');
}
function exportAll(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.industries.map(r=>{const{_id,...rest}=r;return rest;})),'行业管理');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.jobs.map(r=>{const{_id,...rest}=r;return rest;})),'职业管理');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.city_risks.map(r=>{const{_id,...rest}=r;return rest;})),'城市风控');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.tier_framework),'行业分层框架');
  const cs=DB.city_profiles[0]?.values||[];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.city_profiles.slice(1).map(m=>{const r={'对比维度':m.metric};cs.forEach((c,i)=>r[c]=m.values[i]||'');return r;})),'城市画像对比');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.industry_selection),'行业选择');
  Object.keys(DB.city_archives).forEach(city=>{XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(DB.city_archives[city]),'城市档案·'+city);});
  XLSX.writeFile(wb,'小微行业知识库_全量导出.xlsx');toast('已导出全量数据','success');
}
function exportJSON(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='知识库备份.json';a.click();URL.revokeObjectURL(u);toast('JSON备份已导出','success');}

// ===== IMPORT =====
function renderImport(){
  document.getElementById('content').innerHTML=`<div class="card"><div class="ch"><span class="ct">数据导入</span></div><p class="t2 mb4">支持导入JSON备份文件恢复数据，或导入Excel文件覆盖对应数据表。</p><div class="fg"><label>导入JSON备份</label><input type="file" class="in" accept=".json" onchange="importJSON(event)"></div><div class="sd"></div><div class="fg"><label>导入Excel数据</label><input type="file" class="in" accept=".xlsx,.xls" onchange="importXLSX(event)"><p class="txs t2 mt2">Excel文件需要包含与导出格式一致的工作表名称</p></div></div><div class="card"><div class="ch"><span class="ct">当前数据概览</span></div><div class="dg"><dt>行业总数</dt><dd>${DB.industries.length}</dd><dt>职业总数</dt><dd>${DB.jobs.length}</dd><dt>城市风控记录</dt><dd>${DB.city_risks.length}</dd><dt>分层框架</dt><dd>${DB.tier_framework.length}</dd><dt>城市画像</dt><dd>${DB.city_profiles.length-1}个维度</dd><dt>城市档案</dt><dd>${Object.keys(DB.city_archives).length}个城市</dd></div></div>`;
}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.industries||!d.jobs||!d.city_risks)throw new Error('文件格式不正确');DB=d;saveToStorage();updateBadges();toast('JSON数据导入成功','success');showPage('dashboard');}catch(err){toast('导入失败: '+err.message,'error');}};r.readAsText(f);}
function importXLSX(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});let n=0;wb.SheetNames.forEach(name=>{const d=XLSX.utils.sheet_to_json(wb.Sheets[name]);if(!d.length)return;if(name==='行业管理'){DB.industries=d.map((r,i)=>({...r,_id:'ind_imp_'+i}));n++;}else if(name==='职业管理'){DB.jobs=d.map((r,i)=>({...r,_id:'job_imp_'+i}));n++;}else if(name==='城市风控'){DB.city_risks=d.map((r,i)=>({...r,_id:'cr_imp_'+i}));n++;}else if(name==='行业分层框架')DB.tier_framework=d;else if(name==='行业选择')DB.industry_selection=d;});saveToStorage();updateBadges();toast('Excel导入成功，更新了'+n+'个数据表','success');showPage('dashboard');}catch(err){toast('导入失败: '+err.message,'error');}};r.readAsArrayBuffer(f);}

// ===== SEARCH =====
function renderSearch(){
  document.getElementById('content').innerHTML=`<div class="card"><div class="ch"><span class="ct">全局搜索</span></div><div class="fb"><div class="sb" style="flex:3"><input class="in" id="gs" placeholder="输入关键词搜索所有数据..." oninput="globalSearch()" style="font-size:15px;padding:12px 16px 12px 40px"></div></div><div id="sr"></div></div>`;
  document.getElementById('gs').focus();
}
function globalSearch(){
  const q=(document.getElementById('gs')?.value||'').toLowerCase().trim();
  const res=document.getElementById('sr');if(!q){res.innerHTML='';return;}
  let h='';
  const ir=DB.industries.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q))).slice(0,10);
  if(ir.length){h+='<h4 class="mb2">🏢 行业 ('+ir.length+')</h4><div class="tw mb4"><table><thead><tr><th>编号</th><th>门类</th><th>细分行业</th><th>毛利率</th><th>操作</th></tr></thead><tbody>';ir.forEach(r=>{h+='<tr><td class="fb2" style="color:var(--primary)">'+r['行业编号']+'</td><td>'+r['行业门类']+'</td><td class="fb2">'+hl(r['细分行业'],q)+'</td><td>'+r['毛利率区间']+'</td><td><button class="btn bo bi" onclick="viewIndustry(\''+r._id+'\')">👁</button></td></tr>';});h+='</tbody></table></div>';}
  const jr=DB.jobs.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q))).slice(0,10);
  if(jr.length){h+='<h4 class="mb2">👥 职业 ('+jr.length+')</h4><div class="tw mb4"><table><thead><tr><th>行业编号</th><th>职位</th><th>岗位说明</th><th>操作</th></tr></thead><tbody>';jr.forEach(r=>{h+='<tr><td class="fb2" style="color:var(--primary)">'+r['行业编号']+'</td><td class="fb2">'+hl(r['常见职位'],q)+'</td><td class="trc">'+hl(truncate(r['这个岗位每天干什么'],60),q)+'</td><td><button class="btn bo bi" onclick="viewJob(\''+r._id+'\')">👁</button></td></tr>';});h+='</tbody></table></div>';}
  const cr=DB.city_risks.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q))).slice(0,10);
  if(cr.length){h+='<h4 class="mb2">🏙 城市风控 ('+cr.length+')</h4><div class="tw mb4"><table><thead><tr><th>行业编号</th><th>城市</th><th>风险层级</th><th>依据</th><th>操作</th></tr></thead><tbody>';cr.forEach(r=>{const l=(r['城市风险层级']||'').charAt(0).toLowerCase();h+='<tr><td class="fb2" style="color:var(--primary)">'+r['行业编号']+'</td><td class="fb2">'+hl(r['城市'],q)+'</td><td><span class="badge b'+l+'">'+r['城市风险层级']+'</span></td><td class="trc">'+hl(truncate(r['城市风险依据与尽调要点'],60),q)+'</td><td><button class="btn bo bi" onclick="viewCityRisk(\''+r._id+'\')">👁</button></td></tr>';});h+='</tbody></table></div>';}
  if(!h)h='<div class="es"><div class="ic">🔍</div><p>未找到匹配结果</p></div>';
  res.innerHTML=h;
}
function hl(t,q){if(!t)return'-';const s=String(t);const i=s.toLowerCase().indexOf(q);if(i<0)return escapeHtml(s);return escapeHtml(s.substring(0,i))+'<mark>'+escapeHtml(s.substring(i,i+q.length))+'</mark>'+escapeHtml(s.substring(i+q.length));}

function exportCurrentPage(){
  if(currentPage==='industries')exportSheet('industries');
  else if(currentPage==='jobs')exportSheet('jobs');
  else if(currentPage==='cityrisks')exportSheet('city_risks');
  else if(currentPage==='tier')exportSheet('tier_framework');
  else if(currentPage==='cityprofile')exportSheet('city_profiles');
  else if(currentPage==='crosstable')exportSheet('cross_table');
  else toast('当前页面不支持导出，请使用数据导出页面','info');
}

if(sessionStorage.getItem('xwk_auth')==='ok'){
  init();
}else{
  document.getElementById('login-pw').focus();
}
