<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小微行业知识库 V3</title>
<link rel="stylesheet" href="style-v3.css">
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🏢</div>
    <h1>小微行业知识库</h1>
    <p class="login-sub">V3 · 行业与岗位知识看板</p>
    <form id="loginForm" autocomplete="on">
      <label class="fld">
        <span>账号</span>
        <input type="text" id="loginUser" name="username" autocomplete="username" placeholder="请输入账号" required>
      </label>
      <label class="fld">
        <span>密码</span>
        <input type="password" id="loginPass" name="password" autocomplete="current-password" placeholder="请输入密码" required>
      </label>
      <div id="loginErr" class="login-err"></div>
      <button type="submit" class="btn-primary btn-block" id="loginBtn">登 录</button>
    </form>
    <p class="login-tip">仅限授权人员访问</p>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="appView" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-ico">🏢</span>
      <span class="brand-txt">小微行业知识库<small>V3 看板</small></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="metaMini" class="meta-mini"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="navToggle" title="菜单">☰</button>
      <div class="crumb" id="crumb">数据看板</div>
      <div class="top-right">
        <div class="userbox">
          <span class="avatar" id="userAvatar">高</span>
          <div class="userinfo">
            <b id="userName">—</b>
            <small id="userRole">—</small>
          </div>
          <div class="usermenu">
            <button data-act="logout">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- ============ 通用弹层 ============ -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox">
    <div class="modal-head"><b id="modalTitle">标题</b><button class="icon-btn" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="data1-v3.js"></script>
<script src="data2-v3.js"></script>
<script src="data3-v3.js"></script>
<script src="data4-v3.js"></script>
<script src="data5-v3.js"></script>
<script src="app-v3.js"></script>
</body>
</html>
